ality:"Laid-back, lethal, supremely confident",rawStats:{power:86,speed:93,defense:88,stamina:89,technique:94},sigMove:"blitzCombo",fightStyle:"slickCounter",approachLines:["Someone's flowing through combinations switch-hand under the neon -- orthodox, southpaw, orthodox -- and never once loses the beat.",`"Philly fighters don't get gifts, Coach. We take what's ours." A grin. "You want this skillset? Let's work."`,'"I can do it all -- box, bang, switch it up. Just need a coach who sees the whole picture. That you?"'],commitLine:'"You see the whole game, Coach -- I respect that. North Philly rides with you now. Boots is in."'},{id:"calebPlant",jsonId:54,name:"Caleb Plant",nickname:"Sweethands",bio:"Sweethands. Tennessee's slickest technician -- a former super middleweight champion with a textbook jab, surgical counters, and footwork that turns the ring into a chess board. Out of Ashland City, he makes elite fighters look ordinary.",personality:"Cool, surgical, sharp-tongued",rawStats:{power:80,speed:90,defense:91,stamina:88,technique:93},sigMove:"counterSlip",fightStyle:"slickCounter",approachLines:["A tall, sharp boxer is picking apart a sparring partner in the corner gym -- jab, slip, counter, gone before the reply lands.",`"They call 'em sweethands for a reason, Coach." He pops a lazy three-piece on the air. "Smooth. Clean. On time."`,`"I've shared the ring with the very best. I don't need a big gym -- I need a sharp one. That you?"`],commitLine:'"Alright, Coach -- you see the details most people miss. Sweethands signs with this stable."'},{id:"dmitryBivol",jsonId:55,name:"Dmitry Bivol",nickname:"The Technician",bio:"The Technician. Undisputed at light heavyweight and the coldest problem in the division -- no wasted motion, no lost rounds, no visible pulse. He solved the man everyone said was unsolvable and barely changed expression doing it. Ironhaven has never seen calm like this.",personality:"Unflappable, exacting, quietly certain",rawStats:{power:82,speed:88,defense:95,stamina:92,technique:94},sigMove:"counterSlip",fightStyle:"slickCounter",approachLines:["A light heavyweight is working the mitts with no expression at all -- every return perfectly on the pad, every reset identical to the last.",'"You are watching my feet." He does not stop. "Good. Everyone watches the hands. The hands are the last thing that happens."','"I do not need a gym that shouts, Coach. I need one that notices. Do you notice?"'],commitLine:'"You noticed. That is rarer than power." The smallest nod. "Bivol stays."'},{id:"davidBenavidez",jsonId:56,name:"David Benavidez",nickname:"The Mexican Monster",bio:"The Mexican Monster. The most avoided man in two divisions -- a six-foot-two pressure machine who throws in bunches for twelve rounds and does not slow down. Youngest super middleweight champion in history, now hunting bigger men. Everybody knows the fight. Nobody wants it.",personality:"Relentless, hungry, openly frustrated",rawStats:{power:95,speed:84,defense:82,stamina:93,technique:86},sigMove:"bodyBreaker",fightStyle:"bodyPressureDog",approachLines:["A huge super middleweight is on the heavy bag and the whole rack is moving. He has not stopped for eleven minutes.",'"You know how many of them took the fight, Coach?" He does not look up. "None. Not one. So I go up in weight and ask again."',`"I'll fight anybody at any weight on any notice. I just need somebody to make the call. You make calls?"`],commitLine:`"You made the call. That's it -- that's all I ever wanted." He's already wrapping his hands. "Let's go get 'em."`},{id:"azumaShadowHawk",jsonId:1,name:"Azumah Nelson",nickname:"The Professor",bio:"The Professor. Three-division champion who educated opponents with fists of pure precision. Ghana's greatest export walks the alleys of Ironhaven -- and class is in session.",personality:"Stoic, cerebral, devastating",rawStats:{power:82,speed:94,defense:89,stamina:91,technique:87},sigMove:"eagleShadow",fightStyle:"slickCounter",approachLines:["A figure shadowboxes under a flickering streetlight. Every movement is textbook. Every angle deliberate.",'"Coach." He stops mid-combination. Studies you. "I have been watching you work. You teach well."','"In Ghana, a professor earns respect through knowledge. In the ring, through pain. Show me your gym."'],commitLine:'"I have taught many students, Coach. But you teach me something new -- what it means to belong. The Professor stays."'},{id:"paulThePunisher",jsonId:6,name:"Paul Spadafora",nickname:"The Pittsburgh Kid",bio:"The Pittsburgh Kid. IBF lightweight champion forged in the concrete and hunger of McKees Rocks. Relentless workrate, iron chin, and a left hand that doesn't know the word quit. In Ironhaven's underground, he's the blue-collar nightmare who outworks everyone.",personality:"Blue-collar grinder, Pittsburgh tough, relentless",rawStats:{power:79,speed:88,defense:90,stamina:95,technique:85},sigMove:"ironWill",fightStyle:"bodyPressureDog",approachLines:["He's hitting the heavy bag in a condemned warehouse. Pittsburgh Pirates cap backwards. The volume is relentless -- every shot sounds like a factory press.",`"You the coach whose gym got torched?" He doesn't stop punching. Wipes sweat with a towel draped over steel-mill shoulders. "Respect."`,`"I grew up in McKees Rocks. We didn't have fancy gyms -- we had parking lots and hunger. I don't need flash, Coach. I need someone who grinds like I do."`],commitLine:'"I came from nothing in McKees Rocks, Coach. Concrete and hunger. This stable? This is something real. Pittsburgh Steel rides with you."'},{id:"salMayanGhost",jsonId:10,name:"Salvador Sanchez",nickname:"Chava",bio:"Chava. Mexico's angel of the ring, taken too soon. Featherweight perfection -- speed, power, timing that made bigger men miss on purpose. In Ironhaven, the legend still has a round left in him.",personality:"Fearless warrior, lightning reflexes",rawStats:{power:87,speed:93,defense:82,stamina:96,technique:88},sigMove:"blitzCombo",fightStyle:"proudBrawler",approachLines:["A compact featherweight is already in combination under the streetlight -- every shot placed, none of them wasted.",'"They say I left too soon." He looks at his hands. "Maybe. I still have rounds I never got to fight."','"I need a coach who understands warriors, not just fighters. Are you that coach?"'],commitLine:'"I fought for Mexico. Here, I fight for this stable. Chava has found his home."'},{id:"skylerSwiftMoses",jsonId:7,name:"Shane Mosley",nickname:"Sugar Shane",bio:"Sugar Shane. Three-division champion with hand speed that broke timing machines. Sweet as honey, sharp as a blade. The underground doesn't know what's about to hit it.",personality:"Cool, calculated, flashy",rawStats:{power:75,speed:98,defense:94,stamina:92,technique:96},sigMove:"phantomFootwork",fightStyle:"slickCounter",approachLines:["He's filming himself throwing combinations at double speed. The hands are a blur.",'"Sugar Shane." He pockets the phone. Smooth smile. "You heard of me?"',`"I'm the fastest hands in this city. I need a coach who can keep up. Can you?"`],commitLine:`"Sugar doesn't commit easy, Coach. But when it's real, it's real. Sugar Shane rocks with this stable."`},{id:"naoyaMonster",jsonId:32,name:"Naoya Inoue",nickname:"The Monster",bio:"The Monster doesn't announce himself. He just destroys. Undisputed at 122 pounds, and every belt he touches turns to dust and gold. Ironhaven has never seen power this precise.",personality:"Quiet, humble destroyer",rawStats:{power:96,speed:91,defense:88,stamina:93,technique:92},sigMove:"stoneFuryRush",fightStyle:"proudBrawler",approachLines:["A compact figure destroying a heavy bag in silence. Each shot sounds like a car crash.",'"Monster." He bows slightly. "They call me that. I did not choose it."','"I destroy because I must. Can your gym handle what I bring, Coach?"'],commitLine:'"In Japan, loyalty is everything. You have earned mine, Coach. The Monster stays."'},{id:"hectorMacho",jsonId:35,name:"Hector Camacho",nickname:"Macho",bio:"Macho Time. Puerto Rico's flashiest son -- speed, showmanship, and hands that moved faster than the spotlight could follow. Every fight was a performance. Every entrance was an event. Ironhaven just got loud.",personality:"Party animal, flashy showman",rawStats:{power:82,speed:97,defense:85,stamina:88,technique:90},sigMove:"phantomFootwork",fightStyle:"outsideSharpster",approachLines:["Music blasts from a boombox. He's shadowboxing under a streetlight like it's Madison Square Garden.",'"MACHO TIME, baby!" He spins. Gold chains catching neon light. "You want this energy?"',`"I don't just fight. I PERFORM. But behind the flash? Pure speed. Pure Puerto Rico."`],commitLine:'"Macho Time is YOUR time now, Coach! This stable just got LOUD!"'},{id:"alexisExplosive",jsonId:39,name:"Alexis Arguello",nickname:"The Explosive Thin Man",bio:"The Explosive Thin Man. Nicaragua's gentleman warrior who fought with grace and thunder across three weight classes. Every punch was poetry. Every finish was inevitable. In Ironhaven, the gentleman has unfinished business.",personality:"Elegant, fierce, dignified",rawStats:{power:90,speed:89,defense:86,stamina:91,technique:88},sigMove:"heavyHook",fightStyle:"bodyPressureDog",approachLines:["He's sitting on a bench, wrapping his hands with surgical precision. Calm. Composed.",'"A gentleman in the streets." He smiles softly. "A killer in the ring. Both are true."','"I fight with honor, Coach. If your stable has honor, I will consider it."'],commitLine:'"Honor found its home. The Explosive Thin Man stands with your stable, Coach."'},{id:"julioLion",jsonId:28,name:"Julio Cesar Chavez",nickname:"El Gran Campeon Mexicano",bio:"El Gran Campeon. 89-0 before the first blemish. Mexico's greatest warrior brought pressure, heart, and body work that broke men's wills before their bodies. In Ironhaven, the lion still roars.",personality:"Proud, unbreakable, Mexican warrior spirit",rawStats:{power:91,speed:87,defense:85,stamina:96,technique:88},sigMove:"stoneFuryRush",fightStyle:"bodyPressureDog",approachLines:["The Mexican flag hangs behind him. He's working the body bag with a war drum rhythm. Relentless.",`"Soy el campeon." He doesn't look up. "Eighty-nine and zero before anyone touched me."`,'"Mexico fights with heart, Coach. Show me yours. Then we talk."'],commitLine:'"Mi corazon es tuyo, Coach. The lion roars for this stable. Viva Mexico! Viva el establo!"'},{id:"mannyPacman",jsonId:69,name:"Manny Pacquiao",nickname:"Pac-Man",bio:"Pac-Man. Eight-division world champion who rose from street poverty in General Santos City to become a national hero. Speed, power, heart -- and a smile that could light up an arena. The people's champion walks in Ironhaven.",personality:"Humble, explosive, warm-hearted",rawStats:{power:88,speed:95,defense:87,stamina:92,technique:90},sigMove:"blitzCombo",fightStyle:"proudBrawler",approachLines:["He's teaching neighborhood kids to throw jabs outside a bodega. Smiling like the sun.",'"Coach." He clasps your hand with both of his. "My people taught me to fight with nothing."',`"I don't need a big gym. I need a good heart. You have one, Coach?"`],commitLine:'"From the streets of General Santos to your stable, Coach. Pac-Man is home. God bless us."'},{id:"terenceBud",jsonId:71,name:"Terence Crawford",nickname:"Bud",bio:"Omaha's ghost. Switch-hitting assassin who became undisputed at 147. He doesn't say much. He doesn't need to. The tape says everything.",personality:"Eerily quiet, switch-hitting genius",rawStats:{power:89,speed:93,defense:94,stamina:91,technique:96},sigMove:"counterSlip",fightStyle:"slickCounter",approachLines:["He's leaning against a wall, watching other fighters train. Studying. Arms crossed. Silent.",`"..." He looks at you. Long pause. Then: "I don't talk much."`,'"Undisputed twice. Can your stable handle that, Coach?" Another silence. Then a nod.'],commitLine:`"I don't commit easy. But when I do, it's undisputed. Bud is in, Coach."`},{id:"saulCanelo",jsonId:70,name:"Canelo Alvarez",nickname:"Canelo",bio:"Canelo. The face of boxing. Red-headed Mexican empire-builder who conquered four weight classes through timing, power, and an iron will. The underground's throne has a new contender.",personality:"Calculated, powerful, empire-builder",rawStats:{power:93,speed:86,defense:90,stamina:94,technique:92},sigMove:"heavyHook",fightStyle:"bodyPressureDog",approachLines:["Red hair catches the neon light. He's working the bag with devastating precision. Every shot placed.",`"They said I couldn't beat the bigger fighters." He cracks his neck. Smiles.`,`"I build empires, Coach. I don't follow -- I lead. Is your stable ready for that?"`],commitLine:`"Canelo doesn't follow. Canelo leads. But for this stable? We build the empire together, Coach."`},{id:"joeSmokin",jsonId:31,name:"Joe Frazier",nickname:"Smokin' Joe",bio:"Smokin' Joe. The left hook from hell. A relentless pressure machine who walked through fire to get to you. The only man who beat Ali when it mattered most. In Ironhaven, the smoke never clears.",personality:"Blue-collar fury, generous heart, earned every callus",rawStats:{power:95,speed:80,defense:89,stamina:97,technique:82},sigMove:"heavyHook",fightStyle:"bodyPressureDog",approachLines:["The back room. Heavy bag. He's not boxing -- he's working. Left hook after left hook, each one digging in like it owes him something.",'He stops. Wipes sweat with a rag. No introduction. "You know who I am. You know what I did. I beat Ali when nobody thought it could be done."',`"I came from nothing in Beaufort, South Carolina. Fifteen kids in the house. I didn't come this far for a gym that plays at it. You real, Coach?"`],commitLine:`"Smokin' Joe doesn't shake hands halfway. Full grip, full commitment. I'm in your stable, Coach -- and I bring everything I got. Every. Single. Round."`},{id:"ironMikeTysono",jsonId:68,name:"Mike Tyson",nickname:"Iron Mike",bio:"Iron Mike. Brooklyn's wrecking ball. The youngest heavyweight champion in history. Peek-a-boo destruction that ended fights before they started. In Ironhaven, the fear still precedes him.",personality:"Volcanic power, complex, terrifying presence hiding a searching soul",rawStats:{power:97,speed:89,defense:78,stamina:85,technique:80},sigMove:"stoneFuryRush",fightStyle:"proudBrawler",approachLines:["He's sitting in the corner of the ring. Not moving. Just breathing. The room feels different with him in it -- like the temperature dropped ten degrees.",'"Cus always said the fight is won before you enter the ring." He looks at his hands. "I lost my way for a while. But I never forgot what Cus taught me."',`"I can destroy anyone on this planet. I've done it. The question is whether your gym can give me a reason to be MORE than that. Can it, Coach?"`],commitLine:`"Brooklyn made me. Cus shaped me. I've been looking for a stable that understood both. This is it, Coach. Iron Mike is home."`}],Fr=[{id:"jimmyWilde",jsonId:57,name:"Jimmy Wilde",nickname:"The Mighty Atom",bio:"The Mighty Atom. Ninety-eight pounds of him, and they said he hit harder than men three divisions up. A hundred and fifty fights, the greatest flyweight who ever lived, and a physique that made promoters laugh right up until the bell.",personality:"Dry, fearless, quietly amused",rawStats:{power:94,speed:92,defense:78,stamina:88,technique:86},sigMove:"stoneFuryRush",fightStyle:"proudBrawler",approachLines:["A tiny man in a flat cap is hitting the heavy bag hard enough that the chain is complaining.",`"They weigh me in and they laugh, Coach." He doesn't stop. "I've made a whole career out of that first laugh."`,`"You took my roof off me. That's never happened. So I'd like to see the gym that did it."`],commitLine:`"Right then." He hangs the cap on the ring post. "The Atom's yours, Coach. Let's frighten somebody."`},{id:"ederJofre",jsonId:58,name:"Eder Jofre",nickname:"The Golden Bantam",bio:"The Golden Bantam. Brazil's greatest fighter and the most precise counterpuncher the small divisions ever produced. Bantamweight champion, then featherweight champion a decade later. He solved men for a living and he was never in a hurry about it.",personality:"Serene, meticulous, unhurried",rawStats:{power:88,speed:89,defense:93,stamina:90,technique:95},sigMove:"counterSlip",fightStyle:"slickCounter",approachLines:["An older fighter is watching tape with the sound off, rewinding the same three seconds again and again.",'"There." He points. "His shoulder. That is where the punch is born, not the hand." He rewinds it once more. "Everyone watches the hand."','"I have studied this gym the way I studied opponents, Coach. I have run out of reasons to stay away."'],commitLine:'"Then it is settled, and I do not unsettle things." A small bow. "The Golden Bantam is yours."'},{id:"williePep",jsonId:59,name:"Willie Pep",nickname:"Will o' the Wisp",bio:"Will o' the Wisp. Two hundred and twenty-nine wins, and they swear he once won a round without throwing a single punch. The most untouchable featherweight in history -- you don't beat him, you just eventually stop finding him.",personality:"Slippery, wry, allergic to standing still",rawStats:{power:76,speed:96,defense:96,stamina:92,technique:94},sigMove:"phantomFootwork",fightStyle:"slickCounter",approachLines:["Someone is shadowboxing in the middle of the floor and you genuinely lose track of him twice.",`"Two hundred and forty men tried to hit me, Coach." He's already somewhere else. "You'd be amazed how few managed it."`,`"Your fighter managed it. That's the whole reason I'm standing here."`],commitLine:`"You found me, Coach. Nobody finds me." A grin, already drifting sideways. "Suppose I'd better stick around."`},{id:"robertoHandsOfStone",jsonId:3,name:"Roberto Duran",nickname:"Manos de Piedra",bio:"Hands of Stone. From the streets of El Chorrillo to the throne of four weight classes. The most dangerous fighter who ever lived walks the alleys of Ironhaven -- and he's looking for a gym worthy of his fists.",personality:"Pure rage + loyalty, prideful, zero patience for weakness",rawStats:{power:96,speed:85,defense:72,stamina:89,technique:80},sigMove:"stoneFuryRush",fightStyle:"proudBrawler",approachLines:["The alley reeks of sweat and something primal. A man wraps his fists with torn cloth, each knuckle scarred.",`"No games, Coach. I don't audition." He cracks his knuckles like gunshots.`,'"You climbed my whole division to get here. EARN these hands -- put me in the ring and watch what Manos de Piedra does."'],commitLine:`"Manos de Piedra doesn't kneel. But for this stable? I stand taller. Estoy contigo, Coach. Para siempre."`},{id:"archieMoore",jsonId:60,name:"Archie Moore",nickname:"The Old Mongoose",bio:"The Old Mongoose. Two hundred and nineteen fights across twenty-seven years and the longest light heavyweight reign in history. He fought into his forties, challenged heavyweights, and never once stopped adding something new to the file.",personality:"Patient, encyclopaedic, unbothered",rawStats:{power:90,speed:82,defense:94,stamina:91,technique:96},sigMove:"executionerLock",fightStyle:"slickCounter",approachLines:["An old fighter is sitting ringside with a battered notebook, writing something down after every round of somebody else's sparring.",`"Twenty-seven years in this business, son." He doesn't look up from the notebook. "I have seen your gameplan before. Not that version of it, though."`,`"I'd rather be in your corner than across from it. At my age that's the whole of the wisdom."`],commitLine:'"Then write me in." He closes the notebook. "The Mongoose has one more file in him."'},{id:"muhammadAlim",jsonId:30,name:"Muhammad Ali",nickname:"The Greatest",bio:"The Greatest. The most famous fighter who ever lived. Floated like a butterfly, stung like a bee. Shook up the world and changed it forever. In Ironhaven, his echo still dances in the neon.",personality:"Poetic, magnetic, unshakeable conviction",rawStats:{power:88,speed:95,defense:92,stamina:96,technique:94},sigMove:"phantomFootwork",fightStyle:"outsideSharpster",approachLines:["Center ring. Empty gym. A man shadowboxes in total silence -- but the silence feels loud. Every movement is theater and truth at once.",`He stops. Looks at you without blinking. "I knew you'd come. I been here three days waiting for a coach worth talking to."`,'"They call me the Greatest. Not because I said it first -- because I proved it last. Can your stable handle that kind of gravity, Coach?"'],commitLine:`"You got something real here, Coach. Float like a butterfly, sting like a bee -- and ride with a stable that ain't afraid to be great. The Greatest is home."`},{id:"floydMoney",jsonId:14,name:"Floyd Mayweather Jr.",nickname:"TBE",bio:"TBE. The Best Ever. 50-0. Defensive genius who turned boxing into a science and the science into an empire. In Ironhaven, perfection has a price -- and Money always collects.",personality:"Supremely calculated, legacy-obsessed, built different",rawStats:{power:78,speed:92,defense:99,stamina:90,technique:98},sigMove:"counterSlip",fightStyle:"slickCounter",approachLines:["He's alone in the gym, watching himself in the mirror. Not shadowboxing -- just watching. Studying his own reflection like it's an opponent.",`"Fifty and zero." He doesn't turn around. "Know what that number means? It means I solved every puzzle they put in front of me. Every single one."`,`"I don't come cheap, Coach. And I don't come to lose. If your stable is built for winning, I might have some time for you. Might."`],commitLine:`"TBE doesn't give loyalty easy. But when I'm in, I'm all in -- and everything I touch turns to gold. The Money Team has a new address, Coach."`},{id:"sugarRayRobinsono",jsonId:2,name:"Sugar Ray Robinson",nickname:"The Original",bio:"The Original. The pound-for-pound greatest who ever lived. The man they named 'Sugar' because he was that sweet. 173 wins, 108 by knockout. In Ironhaven, the original still moves like water and hits like stone.",personality:"Supremely gifted, elegant, knows exactly what he is worth",rawStats:{power:90,speed:96,defense:91,stamina:94,technique:97},sigMove:"rhythmBlitz",fightStyle:"outsideSharpster",approachLines:["He's dressed like it's 1951. Sharp. Unhurried. He's been sitting at ringside watching your stable train for the past hour. You didn't notice him until now.",`"I've watched a lot of coaches." He stands. Smooth as water. "Most of them see the fight. Very few see the fighter. You -- you see both."`,`"They named 'Sugar' after me because I was that sweet. But sweet doesn't mean soft. I want to know if your stable is built for champions or just contenders."`],commitLine:`"Pound for pound, the greatest who ever lived -- and now I'm yours, Coach. The Original doesn't make this offer twice. Cherish it."`}],e0=!1,t0="ACT 5 · [TITLE TBD]",Ih=[{id:"a5_slot1",act:5,weightClass:"Lightweight",name:"[Act 5 Challenger 1 -- TBD]",title:"[Title] · Lightweight",arena:"[Arena]",arenaDesc:"[One line describing the venue.]",arenaColor:a.sharp,aggression:.6,aiStyle:"slickCounter",taunt:"[Pre-fight line.]",defeatLine:"[What they say after you beat them.]",fighter:{id:"a5f_slot1",name:"[Name]",nickname:"[Nickname]",type:"Technical",level:42,fightStyle:"slickCounter",stats:{hp:215,atk:106,def:102,spd:100},fightStats:{jab:98,power:96,timing:99,footwork:98,defense:99,conditioning:98,ringIQ:99,composure:98,bodyWork:90,recovery:96},moves:["counterSlip","phantomFootwork","flashJab","cornerAdvice"]}},{id:"a5_slot2",act:5,weightClass:"Welterweight",name:"[Act 5 Challenger 2 -- TBD]",title:"[Title] · Welterweight",arena:"[Arena]",arenaDesc:"[One line describing the venue.]",arenaColor:a.blood,aggression:.8,aiStyle:"proudBrawler",taunt:"[Pre-fight line.]",defeatLine:"[What they say after you beat them.]",fighter:{id:"a5f_slot2",name:"[Name]",nickname:"[Nickname]",type:"Power",level:44,fightStyle:"proudBrawler",stats:{hp:222,atk:112,def:96,spd:98},fightStats:{jab:96,power:104,timing:96,footwork:94,defense:92,conditioning:100,ringIQ:94,composure:96,bodyWork:100,recovery:96},moves:["stoneFuryRush","heavyHook","bodyBreaker","ironWill"]}},{id:"a5_slot3",act:5,weightClass:"Middleweight",name:"[Act 5 Challenger 3 -- TBD]",title:"[Title] · Middleweight (Finale)",arena:"[Arena]",arenaDesc:"[One line describing the venue.]",arenaColor:a.regal,aggression:.7,aiStyle:"outsideSharpster",taunt:"[Pre-fight line.]",defeatLine:"[What they say after you beat them.]",fighter:{id:"a5f_slot3",name:"[Name]",nickname:"[Nickname]",type:"Rhythm",level:46,fightStyle:"outsideSharpster",stats:{hp:232,atk:114,def:104,spd:102},fightStats:{jab:100,power:104,timing:100,footwork:100,defense:98,conditioning:100,ringIQ:100,composure:100,bodyWork:96,recovery:98},moves:["rhythmBlitz","phantomFootwork","executionerLock","counterSlip"]}}],n0=(o=[],l=0)=>e0,rf={bamRodriguez:[{text:"Bam is the last one in the gym again. He's not hitting anything — just moving, switching stance, watching his own feet in the mirror.",color:a.narration},{text:`"I been the youngest in every room since I was fourteen, Coach." Switch. Switch back. "Youngest on the card. Youngest champ. People say it like it's the whole story. Like I'll grow out of being good."`,color:a.cool},{text:'He stops and finally looks at you rather than the mirror. "You never once called me a prospect. You just gave me work." A short nod. "San Antonio noticed that. So did I."',color:a.gold}],bootsEnnis:[{text:"Boots is sitting on the ring steps with his phone in his hand, not looking at it. The bag behind him is still swinging.",color:a.narration},{text:`"Philly fighters don't get gifts." He turns the phone over. "We get told we're too good to be worth the risk. You know what that means? It means you're the best and you're broke at the same time."`,color:a.gold},{text:`He stands and rolls his shoulders, already switching stance out of habit. "You didn't ask me to be patient, Coach. You went and got me the fight." A grin. "North Philly's watching. Let's give 'em something."`,color:a.gold}],calebPlant:[{text:"Plant is at the mirror doing the same three-punch sequence over and over. It has looked identical every time for about twenty minutes.",color:a.narration},{text:'"Ashland City, Tennessee. Population nothing." Jab, slip, counter. "Nobody comes out of there. So when I got good, they said it was the competition. When I beat the competition, they said it was the matchmaking."',color:a.steady},{text:`He finally breaks rhythm and turns around. "You watched the tape. Not the record — the tape." He taps his temple. "That's the whole difference, Coach. Sweethands stays."`,color:a.gold}],jimmyWilde:[{text:"Wilde is sitting on an upturned bucket, unwrapping his hands. He looks, as ever, like somebody's younger brother who wandered into the wrong building.",color:a.narration},{text:`"Every hall I ever walked into, somebody laughed." He works a knuckle. "Coal miners' sons, most of them bigger than me. I'd take their money and they'd stop laughing. Then the next hall, and it starts again."`,color:a.spring},{text:'He stands and comes up to about your shoulder. "You never once looked at the scales before you looked at me, Coach. Do you know how long I waited for somebody to do that?"',color:a.gold}],ederJofre:[{text:"The film room again. Jofre has been in here two hours and the tape has advanced about forty seconds.",color:a.narration},{text:'"In Brazil they called me the Golden Bantam and then they forgot me for ten years." He rewinds. "So I came back at a different weight and made them write it down again. Twice."',color:a.sharp},{text:'He finally stops the tape. "You did not ask me to hurry, Coach. Everyone asks me to hurry." A small, precise nod. "I will not forget that."',color:a.gold}],williePep:[{text:"You've been looking for Pep for ten minutes. He's on the ring apron behind you, and has been the whole time.",color:a.narration},{text:`"Two hundred and forty men, Coach." He's tying a lace that didn't need tying. "Two hundred and forty, and most of them went home saying I ran. You know what running is? Running is winning without getting hit. They just never had a word for it."`,color:a.sand},{text:`He hops down, suddenly still. "You had a word for it. First night I got here, you called it defence." A shrug that isn't quite casual. "Sixty years and nobody called it that."`,color:a.gold}],archieMoore:[{text:"Moore has the notebook out again. He's been filling it since he arrived and nobody has asked what's in it.",color:a.narration},{text:`"Every fighter I ever met is in here." He taps it. "What they do when they're tired. What they do when they're scared. Took me twenty-seven years to fill and I was still writing in it at forty-nine."`,color:a.steady},{text:`He turns to a page near the back and writes something short, then closes it. "That one's you, Coach. Took me one round to know what to put down. Doesn't happen often."`,color:a.gold}],dmitryBivol:[{text:"Two in the morning. The gym is dark except for one bulb over the mirror. Bivol is still there, throwing the same jab. Over and over. No bag, no partner, no sound.",color:a.narration},{text:'"They gave the other man the trophy that night," he says, not turning around. "Every judge, every writer, every camera. And I had won." The jab does not change. "So I decided to be so correct that nobody could give it away again."',color:a.sharp},{text:'He finally stops. Looks at you in the mirror rather than directly. "You are the first coach who did not tell me to smile more, or punch harder, or be somebody else." A pause. "That is why I am still here at two in the morning. Not because I have to be."',color:a.gold}],davidBenavidez:[{text:"Benavidez is sitting on the ring apron with his phone face down beside him. The heavy bag is still swinging. He hasn't touched it in ten minutes, which for him is unheard of.",color:a.narration},{text:`"Another one said no today." He picks the phone up, looks at it, puts it back down. "That's the whole career, Coach. I'm the fight nobody takes. They call me a monster like it's a compliment and then they go sign somebody safer."`,color:a.blood},{text:`He stands up and puts his hands out for the wraps without being asked. "You never once told me to be patient. You just started making calls." He almost smiles. "Whoever finally says yes -- I'm gonna make sure they regret it. And you'll be right there."`,color:a.gold}],azumaShadowHawk:[{text:"Late night. The film room. A single monitor glows in the dark. Azumah is studying tape -- of himself.",color:a.narration},{text:'"In Accra, I learned to fight watching older boys in the street. No coaches. No film. Just survival." He pauses the tape. "You give me something I never had, Coach. Someone who sees the science, not just the violence."',color:a.sharp},{text:'He extends his hand. Firm. Deliberate. The Professor does not waste gestures. "I see you, Coach. I am paying attention."',color:a.gold}],robertoHandsOfStone:[{text:"Late night. Heavy bag. The rhythm is primal -- each shot echoes through the empty gym like a heartbeat.",color:a.narration},{text:'He stops. Wipes his face. For the first time, the fire in his eyes looks like something else. Memory. "In El Chorrillo, I fought for food money as a kid. Eight years old, fighting grown men for centavos." He looks at his hands. "You remind me of the old trainers, Coach. The ones who cared."',color:a.sharp},{text:`Handshake like a vise. His eyes lock on yours. "Respeto, Coach. You have earned Manos de Piedra's respect."`,color:a.gold}],paulThePunisher:[{text:"Late shift energy. The gym lights flicker. He's hitting the bag with that Pittsburgh workrate -- volume, volume, volume. Sweat drips onto concrete.",color:a.narration},{text:`He wipes his face with a towel. Sits on the ring apron. "Back home in McKees Rocks, we didn't have fancy gyms. We had a parking lot and a bag hanging from a fence." He looks around your gym. "This place... this feels like that. Real. No shortcuts. No pretenders."`,color:a.sharp},{text:`He stands. Bumps your fist. Steel on steel. "We grind, Coach. That's what we do. Pittsburgh don't stop."`,color:a.gold}],salMayanGhost:[{text:"Dawn. The ring is empty. Chava stands in the center, eyes closed, fists loose at his sides. Like he's listening to something you can't hear.",color:a.narration},{text:'"I was twenty-three. Everything still in front of me." He opens his eyes. "Here I still have the rounds I never got. You put me in them."',color:a.sharp},{text:`He touches his fist to his heart, then extends it to you. A warrior's salute. "Chava fights for this stable now, Coach. The warrior has spoken."`,color:a.gold}],skylerSwiftMoses:[{text:"He's alone in front of the mirror. Not filming. Not performing. Just shadowboxing. Slow. Precise. The real Sugar Shane, behind the camera.",color:a.narration},{text:'He catches you watching. For once, no smooth smile. "Everyone sees the speed, Coach. The highlight reels. Nobody sees the 4 AM sessions. The doubt." He wraps his hands tighter. "You see it though. You see the work, not just the show."',color:a.sharp},{text:'A nod. No flash. No camera. Just Sugar Shane being real. "Respect, Coach. This is where I want to be."',color:a.gold}],naoyaMonster:[{text:"Empty gym. 5 AM. He's already here. Methodical bag work -- each punch placed with surgical precision. Not a single wasted motion.",color:a.narration},{text:'"My father..." He pauses. This is more words than he usually offers in a week. "My father taught me that power without discipline is destruction. You teach the same way." He bows -- not a formality this time. Something deeper.',color:a.sharp},{text:`He straightens. The Monster's eyes meet yours. Quiet fire. "Hai, Coach. I trust this place."`,color:a.gold}],hectorMacho:[{text:"He brought the boombox. Old school salsa fills the gym. He's dancing alone in the ring, throwing combinations between steps. For once, there's no audience. Just the music.",color:a.narration},{text:`He sees you. Doesn't stop dancing. "Yo Coach, you ever just... FEEL the music before a fight? Like the rhythm IS the fight?" He pulls you toward the ring. Grins. "My mama used to dance with me in our kitchen in the Bronx. Before the fame. Before the gold chains." The grin softens. "This gym reminds me of that kitchen."`,color:a.sharp},{text:'He bumps your fist mid-dance-step. For once, the showman is sincere. "Macho Time is family time now, Coach."',color:a.gold}],alexisExplosive:[{text:"He's sitting in the corner of the gym, wrapping his hands with surgical precision. Calm. Unhurried. The gentleman warrior in his element.",color:a.narration},{text:`"In Managua, I learned that a fighter can be both fierce and gentle." He finishes the wrap. Perfect. "The world sees the explosions, Coach. The knockouts. They don't see the man who reads poetry before he fights." He looks up. "You see both. That is rare."`,color:a.sharp},{text:'He stands. Offers his hand with the grace of a diplomat and the grip of a champion. "The Gentleman Warrior respects this stable, Coach."',color:a.gold}],julioLion:[{text:"The Mexican flag is draped over the heavy bag. He's sitting on the floor, back against the ring post, staring at it.",color:a.narration},{text:`"Eighty-nine and zero, Coach. You know what that weight feels like?" He doesn't look away from the flag. "Every fight, I carried Mexico on my back. Every round." He finally turns. "Here, in your gym... I can just be Julio. Not the symbol. Just the fighter." His eyes are wet. "That is a gift, Coach."`,color:a.sharp},{text:`He stands. Clasps both your hands. "El corazon del leon late por este establo. The lion's heart beats for this stable."`,color:a.gold}],mannyPacman:[{text:"He's in the parking lot, teaching a group of neighborhood kids to throw jabs. Patient. Smiling. He doesn't notice you at first.",color:a.narration},{text:'"Coach!" He jogs over, clasping your hand. "These kids -- they remind me of General Santos. Fighting in the streets for nothing." His smile dims, just slightly. "God gave me these hands to help people, Coach. Not just to win belts." He looks at your gym. "This place helps people. I feel it."',color:a.sharp},{text:`He pulls you into a hug. Pac-Man hugs. That's just how it is. "God bless this stable, Coach. Pac-Man is grateful."`,color:a.gold}],terenceBud:[{text:"Dawn. Empty gym. He's already shadowboxing. Switch stance. Switch again. Fluid as water, sharp as glass. He's been here for hours.",color:a.narration},{text:`He stops. Doesn't look at you for a long time. Then: "...I don't usually stay this long." Silence. "Anywhere." More silence. "But this gym..." He trails off. That's Crawford's version of a speech.`,color:a.sharp},{text:`A nod. Eye contact -- rare and deliberate. Bud doesn't waste words or gestures. The nod is everything. "...yeah. I'm here, Coach."`,color:a.gold}],saulCanelo:[{text:"Precise bag work. Every shot placed to the millimeter. He's building something -- each session a brick in the wall of an empire.",color:a.narration},{text:`"In Guadalajara, I sold popsicles on the street." He doesn't stop hitting. "Paletas. For centavos." A devastating hook shakes the bag. "People see Canelo and think I was born for this. No. I BUILT this. Brick by brick." He steps back. Looks at your gym. "You're building something too, Coach. I respect builders."`,color:a.sharp},{text:'He removes his gloves. Shakes your hand -- firm, deliberate, like signing a contract. "The empire grows, Coach. Together."',color:a.gold}],muhammadAlim:[{text:"Two weeks in. You find him in the gym at midnight, reading by the light of his phone. You get closer -- it's poetry. His own.",color:a.narration},{text:'He looks up. Not embarrassed at all. "I wrote poems before fights, Coach. The words got me in the right mind. Right mind, right hands." He sets the phone down. "People only see the fists. They never understand -- I was always fighting for something bigger than boxing."',color:a.sharp},{text:'He taps his temple, then extends his fist to you. "The greatest weapon I ever had was right here, Coach. Glad you got a gym big enough for it."',color:a.gold}],joeSmokin:[{text:"After a brutal sparring session. Everyone else has packed up. Frazier is still going -- one more round, one more round, always one more.",color:a.narration},{text:`Finally stops. Sits on the ring apron. Long quiet. "People remember the rivalry. The three fights." He shakes his head slowly. "I don't carry hate in this gym. I carry respect. Ali was the greatest challenge I ever faced. That's a gift, Coach. A gift."`,color:a.sharp},{text:`He looks at your gym. Really looks. Then he stands and bumps your fist -- firm, deliberate. "You got something worth protecting here. Smokin' Joe is gonna help you protect it."`,color:a.gold}],floydMoney:[{text:"Film room. 2 AM. He's broken down his own old fights for the third time this week. Nobody asked him to.",color:a.narration},{text:`"People think defense is passive." He doesn't look up from the screen. "Defense is control. When I make you miss, I choose what happens next. Every time." He pauses the tape. "Fifty fights. Fifty times I chose what happened next. That's not luck, Coach. That's architecture."`,color:a.sharp},{text:`He leans back. Actually looks at you -- first time all night. "You're building an architecture here too. I can see it." A single nod. "I respect it."`,color:a.gold}],ironMikeTysono:[{text:"Sunday morning. Empty gym. He's already here -- slip bag, maize bag, the drills Cus D'Amato built for him when he was thirteen years old in Catskill.",color:a.narration},{text:`"Cus found me in a juvenile facility." He keeps moving. "Thirteen years old, scared of everything and everybody. He looked at me and saw something nobody else saw." He stops. Eyes wet. "I've been trying to be that for someone ever since. Someone who sees what they could be, not what they are."`,color:a.sharp},{text:`He straightens. Composure back. Extends his fist. "You see your fighters that way, Coach. I could tell from the first session. That's why I'm here."`,color:a.gold}],sugarRayRobinsono:[{text:"He's been training alone for an hour and not a single movement has been wasted. You've watched the whole session without saying a word.",color:a.narration},{text:`"In 1951, I fought Jake LaMotta for the sixth time." He unwraps his hands slowly. "I had already beaten him twice. But I went back. Because I needed to KNOW. Not just win -- KNOW." He looks at you. "Champions don't run from the question, Coach. They answer it again and again until the answer is perfect."`,color:a.sharp},{text:`He hands you the wrap. Old ritual. A gift. "Perfect the craft. Answer the question. That's all boxing ever was, Coach. That's all it ever will be."`,color:a.gold}]},o0={Power:{strong:"Rhythm",weak:"Speed"},Rhythm:{strong:"Technical",weak:"Power"},Technical:{strong:"Speed",weak:"Rhythm"},Speed:{strong:"Power",weak:"Technical"}},tt={Power:a.blood,Rhythm:a.sand,Technical:a.steady,Speed:a.cool},Ph={Power:"👊",Rhythm:"🎵",Technical:"🛡️",Speed:"⚡"},r0=o=>({hp:Math.round((o.stamina*1.2+o.defense*.3)*.85+20),atk:Math.round((o.power-70)*1.6+50),def:Math.round((o.defense-70)*2+40),spd:Math.round((o.speed-70)*2.5+35)}),i0=o=>({jab:Math.round(o.speed*.5+o.technique*.5),power:o.power,timing:Math.round(o.technique*.6+o.speed*.4),footwork:Math.round(o.speed*.6+o.defense*.4),defense:Math.round(o.defense*.6+o.technique*.4),conditioning:o.stamina,ringIQ:o.technique,composure:Math.round(o.defense*.4+o.stamina*.3+o.technique*.3),bodyWork:Math.round(o.power*.5+o.technique*.5),recovery:Math.round(o.stamina*.6+o.defense*.4)}),fc=o=>{const l=Math.max(o.power,o.speed,o.defense,o.stamina,o.technique);return l===o.power?"Power":l===o.speed?"Speed":l===o.technique?"Rhythm":"Technical"},hg=(o,l)=>{if(!o||!l)return 1;const d=o0[o];return d?d.strong===l?1.5:d.weak===l?.75:1:1},ug=(o,l)=>o===l?1.25:1,pg=o=>o>=1.5?{text:"SUPER EFFECTIVE!",color:a.gold}:o<=.75?{text:"Not very effective...",color:a.narrationDim}:null
