boxing' develop?",options:["Cardio and breathing control mainly","Technique, form, and muscle memory","Punch resistance and chin durability","Footwork speed and ankle strength"],correct:1,category:"fundamentals",explanation:"Shadowboxing builds the neural pathways that make technique automatic."},{id:"q08",question:"What is the correct body angle in boxing stance?",options:["Squared up facing the opponent","Turned slightly sideways at an angle","Fully bladed, completely sideways","Angled away from the lead hand"],correct:1,category:"fundamentals",explanation:"Slight angle presents a smaller target while keeping both hands in play."},{id:"q09",question:"Why should the rear heel be slightly raised?",options:["To absorb shots with better balance","For quick weight transfer and pivoting","To gain extra height and reach","To protect the ankle from twisting"],correct:1,category:"fundamentals",explanation:"Raised heel loads the spring for explosive movement."},{id:"q10",question:"What is the 'ready position' in boxing?",options:["Hands low and relaxed for speed","Hands up, chin tucked, elbows in","Wide stance with hands extended","Arms crossed high over the chest"],correct:1,category:"fundamentals",explanation:"This position protects vitals and keeps weapons loaded."},{id:"q11",question:"After any defensive action, what must you do?",options:["Counter immediately with full power","Return to your stance immediately","Reset your feet and step backward","Clinch to prevent the follow-up shot"],correct:1,category:"fundamentals",explanation:"Defense without reset leaves you vulnerable to the next shot."},{id:"q12",question:"What does 'keeping your chin down' protect against?",options:["Hooks to the body and liver","Uppercuts and knockout punches","Jabs that snap the head back","Cuts opening above the eyebrows"],correct:1,category:"fundamentals",explanation:"A tucked chin shields the jaw behind the shoulder."},{id:"q13",question:"In boxing, which foot moves first when stepping forward?",options:["The rear foot pushes and steps first","The lead foot steps, the rear follows","Both feet shuffle at the same time","Whichever foot is carrying less weight"],correct:1,category:"fundamentals",explanation:"Lead foot steps, rear foot follows -- never cross your feet."},{id:"q14",question:"What is the main purpose of a warm-up?",options:["To rehearse the full fight gameplan","To increase blood flow and prevent injury","To establish a mental edge before the bell","To pre-fatigue muscles for endurance"],correct:1,category:"fundamentals",explanation:"Cold muscles tear. Warm muscles perform."},{id:"q15",question:"What are the four core punches in boxing?",options:["Jab, cross, hook, uppercut","Jab, cross, overhand, check hook","Jab, hook, bolo punch, haymaker","Cross, hook, uppercut, body shot"],correct:0,category:"fundamentals",explanation:"Everything in boxing is built from these four punches."},{id:"q16",question:"What is a 'shoulder roll'?",options:["A warm-up rotation for the rotator cuff","Using the lead shoulder to deflect punches","Rolling under hooks while stepping outside","Dipping the shoulder to load the cross"],correct:1,category:"defense",explanation:"The Philly Shell -- shoulder catches shots while counter hand stays loaded."},{id:"q17",question:"What is the purpose of a clinch?",options:["To assert physical dominance inside","To reset, recover, and smother offense","To score points with short inside shots","To force the referee to break the action"],correct:1,category:"defense",explanation:"The clinch is a survival tool and rhythm breaker."},{id:"q18",question:"What does 'rolling with the punch' mean?",options:["Countering while rotating the hips through","Moving with the punch to reduce its impact","Ducking low beneath the arc of the punch","Absorbing it flush on a tightened guard"],correct:1,category:"defense",explanation:"Moving with force dissipates energy across a longer path."},{id:"q19",question:"What is 'catch and shoot'?",options:["Blocking and immediately clinching after","Catching the punch and countering instantly","Slipping outside before resetting range","Trapping the opponent's glove and holding"],correct:1,category:"defense",explanation:"Catch the jab, fire back instantly while they're extended."},{id:"q20",question:"What is the safest way to exit the ropes?",options:["Fire back hard to back them off first","Pivot off at an angle to escape","Push straight forward through the middle","Slide along the ropes toward the corner"],correct:1,category:"defense",explanation:"Pivoting creates the angle to escape without eating shots."},{id:"q21",question:"When slipping a punch, should you bend at the waist?",options:["Yes -- the waist gives the fastest dip","No -- bend at the knees instead","Either works if the timing is right","No -- lean straight back at the hips"],correct:1,category:"defense",explanation:"Waist bending kills your base. Knee bending keeps you balanced."},{id:"q22",question:"What is a 'bob and weave'?",options:["A bouncing rhythm to disguise entries","Dipping under hooks while moving laterally","Ducking straight down and stepping back","Weaving punches into long combinations"],correct:1,category:"defense",explanation:"Bob under the hook, weave to the other side, come up in position."},{id:"q23",question:"What does 'making them miss, making them pay' describe?",options:["Outpointing with constant movement","Counter-punching right after evasion","Drawing fouls to win on the scorecards","Pressuring until they punch themselves out"],correct:1,category:"defense",explanation:"The sweet science: avoid the shot, punish the opening."},{id:"q24",question:"Why is head movement important even when not being punched?",options:["It conserves energy between exchanges","It keeps you a moving target, hard to time","It signals confidence to the judges","It improves your view of their footwork"],correct:1,category:"defense",explanation:"A stationary head is an easy target. Movement adds uncertainty."},{id:"q25",question:"What is a 'parry'?",options:["Catching a punch flush on the glove","Redirecting a punch with a small hand tap","Blocking with both forearms together","Countering over the top of the jab"],correct:1,category:"defense",explanation:"Minimum effort, maximum disruption -- nudge the punch offline."},{id:"q26",question:"Which punch typically generates the most power?",options:["The lead jab at full extension","The lead hook off the pivot","The cross (rear straight)","The rear uppercut inside"],correct:2,category:"offense",explanation:"The cross channels full body rotation from the rear hand."},{id:"q27",question:"What is a '1-2' combination?",options:["A hook followed by an uppercut","A jab followed by a cross","Two quick jabs in succession","A cross followed by a lead hook"],correct:1,category:"offense",explanation:"The most fundamental combination in boxing."},{id:"q28",question:"Why do body shots slow an opponent down?",options:["They force constant clinching exchanges","They drain stamina and drop the guard over time","They score double on the judges' cards","They mainly damage the blocking arms"],correct:1,category:"offense",explanation:"Body work is an investment that pays off in later rounds."},{id:"q29",question:"What is the purpose of feinting?",options:["To burn clock while protecting a lead","To create openings by drawing reactions","To intimidate and break their confidence","To disguise stance switches mid-round"],correct:1,category:"offense",explanation:"A good feint makes the opponent commit, creating the real opening."},{id:"q30",question:"What makes an uppercut effective inside?",options:["It carries the most knockout power","It travels upward straight through the guard","It is the fastest punch at close range","It cannot be blocked while clinching"],correct:1,category:"offense",explanation:"At close range, the upward angle splits the guard."},{id:"q31",question:"What is 'punching from the ground up'?",options:["Targeting the body before the head","Driving power from legs through hips to fist","Punching upward from a crouched stance","Loading every shot with a deep knee bend"],correct:1,category:"offense",explanation:"Power flows from feet to legs to hips to core to shoulder to fist."},{id:"q32",question:"Why is the non-punching hand important?",options:["It loads the next punch in the chain","It guards the chin while the other attacks","It maintains balance through the rotation","It measures distance for the power hand"],correct:1,category:"offense",explanation:"One hand works, one hand protects. Always."},{id:"q33",question:"What common error do fighters make after landing a jab?",options:["They admire the shot a beat too long","They drop the hand instead of retracting it","They square up to load the next cross","They lean in chasing the follow-up shot"],correct:1,category:"offense",explanation:"A lazy retraction is an open invitation for a counter."},{id:"q34",question:"Where does the power of a hook come from?",options:["The bicep and forearm driving through","Hip and core rotation through the shot","The wrist snapping at full extension","The shoulder swinging the arm across"],correct:1,category:"offense",explanation:"The hook is powered by rotational force, not arm strength."},{id:"q35",question:"What is the purpose of a 'setup punch'?",options:["To end the fight with one clean shot","To create openings for the real attack","To stay busy and steal the round late","To physically back them onto the ropes"],correct:1,category:"offense",explanation:"Setup punches establish patterns that power shots exploit."},{id:"q36",question:"How should combinations be developed in training?",options:["Drill at full speed from the first day","Start slow, build speed, make them automatic","Master single punches before any combos","Mirror professional combinations exactly"],correct:1,category:"offense",explanation:"Muscle memory comes from deliberate, progressive repetition."},{id:"q37",question:"What is an 'arm punch' and why is it bad?",options:["A punch thrown with only the arm, no rotation -- weak","A short punch built for speed inside the pocket","A jab variant used only to measure distance","A defensive punch thrown while retreating"],correct:0,category:"offense",explanation:"Without body rotation, you're leaving 80% of your power on the table."},{id:"q38",question:"What is the best range for straight punches?",options:["Inside the pocket at close range","Long to mid range with room to extend","Any range with proper hip rotation","Clinch range using short leverage"],correct:1,category:"offense",explanation:"Straights need room to extend. Inside, they lose leverage."},{id:"q39",question:"What is the best range for hooks and uppercuts?",options:["Long range at full arm extension","Mid to close range inside the arc","Any range if the hips rotate fully","Outside the opponent's jab distance"],correct:1,category:"offense",explanation:"Hooks and uppercuts need the arc -- too far and they become arm punches."},{id:"q40",question:"What is 'cutting off the ring'?",options:["Shrinking your movement to save energy","Controlling angles to trap them on the ropes","Forcing every exchange in the center","Backing straight up to draw them forward"],correct:1,category:"strategy",explanation:"Ring generalship -- use angles to herd, not chase."},{id:"q41",question:"Why is ring generalship important?",options:["It demoralizes the opponent's corner","It drains the opponent's stamina faster","It controls pace and wins rounds on the cards","It prevents the opponent from clinching"],correct:2,category:"strategy",explanation:"Judges reward the fighter who dictates where the fight happens."},{id:"q42",question:"What does 'fighting behind the jab' mean?",options:["Keeping the lead hand extended as a shield","Using the jab as the base for all offense","Throwing jabs and nothing else all night","Jabbing only while backing out of range"],correct:1,category:"strategy",explanation:"The jab establishes range, rhythm, and control for everything else."},{id:"q43",question:"What should a fighter do when hurt?",options:["Fire back hard to back them off","Plant the feet and weather the storm","Clinch, move, or tie up to recover","Signal the corner for instructions"],correct:2,category:"strategy",explanation:"Survival mode: smother, grab, move -- buy time for your head to clear."},{id:"q44",question:"When losing late on scorecards, what's most critical?",options:["Tighten defense, avoid a knockout loss","Clinch often to disrupt their rhythm","Increase output and aggression late","Target the body to slow them down"],correct:2,category:"strategy",explanation:"You can't win rounds you don't fight. Volume and urgency change scorecards."},{id:"q45",question:"What does 'styles make fights' mean?",options:["Flashier styles attract bigger paydays","How two styles interact shapes the fight","One dominant style beats all the others","Judges reward stylistic variety on the cards"],correct:1,category:"strategy",explanation:"A pressure fighter vs. a counter puncher is a completely different fight than two brawlers."},{id:"q46",question:"Why would a coach tell a fighter to 'slow down'?",options:["To protect a lead on the scorecards","To conserve energy and fight smarter","To bait the opponent into overcommitting","To reset after losing a hard exchange"],correct:1,category:"strategy",explanation:"Pace management wins fights. Burning out in round 4 loses them."},{id:"q47",question:"What's the advantage of controlling center ring?",options:["It shortens the distance to your corner","You dictate range, angles, and escape routes","The canvas is fastest in the middle","It keeps the referee out of your path"],correct:1,category:"strategy",explanation:"Center ring = options. Ropes = limited options."},{id:"q48",question:"What is a 'chess match' in boxing terms?",options:["A slow fight with little engagement","A tactical fight of constant reads and adjustments","A fight decided by one decisive trap","A points battle with no power punching"],correct:1,category:"strategy",explanation:"Two high-IQ fighters making micro-adjustments every exchange."},{id:"q49",question:"If faster but less powerful, what strategy works best?",options:["Stand and trade to prove a point","Stick and move, outwork them on points","Load up to equalize the power gap","Smother them inside to nullify reach"],correct:1,category:"strategy",explanation:"Speed + volume + angles > raw power if you make them miss."},{id:"q50",question:"Why is it dangerous to fight with your mouth open?",options:["It telegraphs fatigue to the judges","An open jaw breaks easily when struck","It disrupts your breathing rhythm","The mouthpiece can slip and choke you"],correct:1,category:"strategy",explanation:"An open jaw is a loose jaw -- the knockout lever."},{id:"q51",question:"What is 'pot-shotting'?",options:["Targeting the same spot repeatedly","Throwing single hard shots, no combinations","Loading up only when the opponent is hurt","Punching on the break before the ref steps in"],correct:1,category:"strategy",explanation:"Pot-shotting can win rounds with clean, timed single shots."},{id:"q52",question:"The opponent drops their right hand after jabbing. What do you throw?",options:["A counter jab down the middle","A right cross to the open body","A left hook over the dropped hand","A check hook while pivoting out"],correct:2,category:"ring_iq",explanation:"The opening is upstairs over the dropped hand. Left hook counters it clean."},{id:"q53",question:"Your fighter is getting outboxed at range. Adjustment?",options:["Match their jab and win the long game","Close distance, cut the ring, fight inside","Switch stance to change the angles","Draw them forward with a lowered guard"],correct:1,category:"ring_iq",explanation:"If you're losing at range, change the range. Make it ugly."},{id:"q54",question:"The opponent is a body puncher. How do you adjust?",options:["Trade body shots to even the toll","Tight elbows, lateral movement, counter upstairs","Hold center ring and keep them at length","Clinch every time they step inside"],correct:1,category:"ring_iq",explanation:"Tight elbows block body shots. Move laterally so they can't set their feet."},{id:"q55",question:"Your fighter won rounds 1-6 but is tiring. Corner advice?",options:["Press for the knockout while still ahead","Trade in spots to keep the rounds close","Box smart, manage distance, protect the lead","Clinch heavily and drain the clock"],correct:2,category:"ring_iq",explanation:"You're ahead. Don't fight their fight. Smart rounds protect the win."},{id:"q56",question:"Why is the jab the most important punch overall?",options:["It lands more knockouts than any punch","It sets up range, rhythm, scoring, and defense","It is the easiest punch to fully master","It scores highest with ringside judges"],correct:1,category:"ring_iq",explanation:"The jab is the Swiss Army knife of boxing. Everything starts with it."},{id:"q57",question:"What are the 4 official round scoring criteria?",options:["Power, speed, durability, and heart","Clean punching, effective aggression, ring generalship, defense","Knockdowns, total damage, punch volume, control","Accuracy, footwork, combinations, and composure"],correct:1,category:"ring_iq",explanation:"Judges score rounds on these four pillars. Know what wins rounds."},{id:"q58",question:"A southpaw vs. orthodox: what's the key battle?",options:["The jab battle down the middle","Lead foot position -- outside foot wins the angle","The reach and height differential","Timing the straight left versus the right"],correct:1,category:"ring_iq",explanation:"The foot war determines angles. Outside foot = dominant angle."},{id:"q59",question:"Your fighter gets rocked. What's the immediate instruction?",options:["Throw back hard to earn their respect","Cover up tight and plant your feet","Grab, clinch, move -- survive this moment","Circle away fast with your hands low"],correct:2,category:"ring_iq",explanation:"When hurt, survival is the only priority. Grab, hold, move until your head clears."},{id:"q60",question:"What does 'sitting down on your punches' mean?",options:["Settling into a slower, heavier pace","Bending the knees to load leg power into shots","Planting flat-footed for better balance","Dropping weight forward onto the lead leg"],correct:1,category:"ring_iq",explanation:"Knee bend loads the legs -- the biggest muscles in the body -- into every shot."},{id:"q61",question:"Why is roadwork (running) important for boxers?",options:["To cut weight before the weigh-in","To build the cardio base for twelve rounds","To strengthen the legs for knockdowns","To build mental toughness through routine"],correct:1,category:"conditioning",explanation:"The aerobic base determines how long you can sustain output."},{id:"q62",question:"What does 'gas tank' mean in boxing?",options:["A fighter's weight-cutting margin","A fighter's stamina and conditioning level","The power reserve in the rear hand","The ability to absorb body punishment"],correct:1,category:"conditioning",explanation:"When the gas tank empties, technique disappears and chins drop."},{id:"q63",question:"Why do fighters skip rope?",options:["Tradition passed down from the old gyms","Rhythm, footwork, timing, and cardio at once","Calf strength for explosive forward lunges","Hand-eye coordination for counter shots"],correct:1,category:"conditioning",explanation:"Jump rope is boxing's perfect conditioning tool -- rhythm and endurance in one."},{id:"q64",question:"What happens when a fighter is dehydrated?",options:["Slightly faster but noticeably weaker","Slower reactions, less power, weaker chin","Mainly cramping in the later rounds","Reduced sweating and overheating risk"],correct:1,category:"conditioning",explanation:"Dehydration is the silent killer. Every system degrades."},{id:"q65",question:"Why are body shots more effective in later rounds?",options:["Judges weight body shots more heavily after round six","Accumulated damage compounds -- less protection, less recovery","The midsection softens as the fight adrenaline fades","Tired fighters keep their guard pinned too high upstairs"],correct:1,category:"conditioning",explanation:"Round 1 body shots set up round 8 stoppages. Investment banking with fists."},{id:"q66",question:"What does a corner man use an enswell for?",options:["To numb cuts before applying solution","To press down swelling around the eyes","To cool the neck and reset breathing","To realign the nose after a break"],correct:1,category:"corner",explanation:"Cold metal compresses swelling. Can't fight if you can't see."},{id:"q67",question:"When should a corner consider stopping a fight?",options:["After the first hard knockdown scored","When the fighter can no longer defend intelligently","Whenever the crowd turns against them","Once the points deficit looks unwinnable"],correct:1,category:"corner",explanation:"The corner's first duty is their fighter's safety. Period."},{id:"q68",question:"What's the most important thing a corner can say between rounds?",options:["A detailed breakdown of every round","One clear, actionable instruction","Pure motivation to lift their spirits","An honest read of the current scorecards"],correct:1,category:"corner",explanation:"60 seconds. One adjustment they can actually execute. That's the game."},{id:"q69",question:"Why do corners put Vaseline on a fighter's face?",options:["To keep facial muscles warm and loose","To help punches slide off and reduce cuts","To seal small cuts between the rounds","To stop sweat from running into the eyes"],correct:1,category:"corner",explanation:"Slick surface = glancing blows. Reduces the chance of cuts."},{id:"q70",question:"What is the corner's role during the fight itself?",options:["Stay silent to avoid confusing the fighter","Real-time coaching, reading the opponent, managing the plan","Track the scorecards and signal the totals","Prepare the stool and supplies for the break"],correct:1,category:"corner",explanation:"A great corner is a second brain reading the fight in real-time."},{id:"q71",question:"What does 'the sweet science' refer to?",options:["The chemistry of fight-night adrenaline","The art and science of boxing itself","The study of knockout pressure points","The footwork systems of old-school boxers"],correct:1,category:"history",explanation:"Boxing at its highest level is artistry disguised as violence."},{id:"q72",question:"What is the 'neutral corner'?",options:["The corner shared by both fighters' teams","Where the standing fighter goes during a count","The corner assigned to the ring physician","Either corner without a stool placed in it"],correct:1,category:"history",explanation:"Rules require the standing fighter to go to a neutral corner during the count."},{id:"q73",question:"Why is the heavyweight division called 'the glamour division'?",options:["Its champions wear the most ornate belts","The biggest fighters draw the biggest audiences and money","It produces the most title unifications","Its lineal title is the oldest in the sport"],correct:1,category:"history",explanation:"Heavyweight champions have always been the biggest stars in the sport."},{id:"q74",question:"What does 'pound for pound' mean?",options:["The official weight at the final weigh-in","Ranking pure skill regardless of weight class","The power-to-weight ratio of a puncher","Fighters holding belts in two divisions"],correct:1,category:"history",explanation:"P4P strips away size and asks: who is the most skilled fighter alive?"},{id:"q75",question:"What is a '10-8 round'?",options:["A round won by clean, sustained jabbing","A dominant round -- knockdown or one-sided beating","A round with two clean knockdowns scored","A penalty round after a point deduction"],correct:1,category:"history",explanation:"10-8 means total domination -- knockdown or sustained one-sided beating."},{id:"q76",question:"What weight class has the most divisions in professional boxing?",options:["Heavyweight, with four recognized tiers","Welterweight, with three sanctioned tiers","There are 17 recognized weight classes in total","Middleweight, with five historical divisions"],correct:2,category:"history",explanation:"From minimumweight (105 lbs) to heavyweight (200+), boxing has 17 weight classes."},{id:"q77",question:"What is the 'saved by the bell' rule?",options:["The bell ends every count in every round","A fighter down at the round's end gets the break to recover","The bell cannot ring during a knockdown","A rule applying only in the final round"],correct:1,category:"history",explanation:"In most jurisdictions, a knockdown at the bell gives the fighter the break to recover."},{id:"q78",question:"What does 'undisputed champion' mean?",options:["An unbeaten record across two divisions","Holding all four major belts in one division","Winning the lineal title from the true champ","Defending one title ten times in a row"],correct:1,category:"history",explanation:"WBA, WBC, IBF, and WBO -- hold all four and you're undisputed."},{id:"q79",question:"What is the 'three knockdown rule'?",options:["Three knockdowns scored ends the round early","Three knockdowns in one round is an automatic TKO","Three total knockdowns forces a medical review","A fighter gets three counts before stoppage"],correct:1,category:"history",explanation:"In jurisdictions that use it, three knockdowns in a single round stops the fight."},{id:"q80",question:"What is a 'flash knockdown'?",options:["A knockdown inside the first thirty seconds","A knockdown from balance, not real damage","A knockdown the referee rules as a slip","A knockdown scored off a counter shot"],correct:1,category:"history",explanation:"Flash knockdowns happen -- sometimes a clean shot catches you moving, not damaged."},{id:"q81",question:"Why does the corner spray water in a fighter's face between rounds?",options:["To rinse blood away from the eyes","To close pores, cool the skin, and sharpen alertness","To loosen tight neck and shoulder muscles","To keep the mouthpiece from drying out"],correct:1,category:"corner",explanation:"Cold water constricts blood vessels, cools the skin, and snaps attention back."},{id:"q82",question:"What is a 'chief second'?",options:["The licensed backup fighter on standby","The head corner man who directs strategy and stoppages","The second-ranked contender at ringside","The assistant handling water and equipment"],correct:1,category:"corner",explanation:"The chief second runs the corner. Their word is law between rounds."},{id:"q83",question:"When a fighter's cut is bleeding badly, what does the cutman use?",options:["Surgical glue under a tight cold wrap","Adrenaline solution with firm direct pressure","Vaseline packed deep into the wound","A chilled enswell pressed to seal the skin"],correct:1,category:"corner",explanation:"Adrenaline constricts blood vessels at the wound. Pressure stops the flow."},{id:"q84",question:"Why should a corner avoid giving too many instructions at once?",options:["Tired fighters cannot process complex information","The referee can penalize excessive coaching","Long instructions cut into recovery breathing","The opposing corner can overhear the gameplan"],correct:0,category:"corner",explanation:"Exhausted, adrenaline-flooded brains can handle one or two clear adjustments. That's it."},{id:"q85",question:"What does 'throwing in the towel' mean?",options:["Conceding the round to save energy","The corner stopping the fight to protect their fighter","A protest against the referee's officiating","Signaling the cutman to enter the ring"],correct:1,category:"corner",explanation:"The towel is the last line of defense. When the corner sees enough, they end it."},{id:"q86",question:"The opponent keeps circling to their left. How do you cut them off?",options:["Chase them directly along their path","Step to YOUR right to intercept their path","Circle left yourself to mirror their movement","Hold center and let them circle into range"],correct:1,category:"ring_iq",explanation:"Cut the ring by heading them off, not chasing. Angles beat speed."},{id:"q87",question:"Your fighter's opponent switches to southpaw mid-fight. Adjustment?",options:["Switch your own stance to mirror them","Establish the lead hand, jab the open side, watch the left","Rush them before they settle into rhythm","Stay at long range until they switch back"],correct:1,category:"ring_iq",explanation:"When they switch, the openings shift. The jab becomes your key to the new angles."},{id:"q88",question:"An opponent keeps lunging in with big punches. Best counter strategy?",options:["Beat them to the punch with your own lunge","Time their entry with a straight right or check hook","Stay on your bicycle and hold the distance","Catch them in a clinch as they come forward"],correct:1,category:"ring_iq",explanation:"Lungers are vulnerable mid-step. Time it right and their momentum works against them."},{id:"q89",question:"Your fighter is shorter than the opponent. What's the gameplan?",options:["Stay long and outjab their longer reach","Get inside the reach, move the head, work the body","Trade head shots early to test their chin","Force a slow pace to neutralize the length"],correct:1,category:"ring_iq",explanation:"Inside their reach, their length is a liability. Make it a phone booth fight."},{id:"q90",question:"What's the danger of always throwing the same combination?",options:["The judges score repeated patterns lower","The opponent times your pattern and counters it","Your stamina drains faster on repeat combos","The combination loses power with each use"],correct:1,category:"ring_iq",explanation:"Predictability in boxing is a death sentence. Vary your attacks."},{id:"q91",question:"Why do some fighters 'steal rounds' in the last 30 seconds?",options:["The final seconds score double on the cards","A late burst leaves a strong impression on the judges","Opponents always coast in the final stretch","It pads the punch stats for the broadcast"],correct:1,category:"strategy",explanation:"Judges remember what they saw last. A strong finish can swing a close round."},{id:"q92",question:"What is the benefit of switching between orthodox and southpaw?",options:["It rests the lead shoulder mid-fight","It creates new angles and disrupts their timing","It splits the judges' scoring attention","It hides a damaged or tiring lead hand"],correct:1,category:"strategy",explanation:"Switch-hitting changes every angle and timing the opponent has calibrated."},{id:"q93",question:"When facing a counter-puncher, what's the best approach?",options:["Wait them out and force them to lead","Use feints and broken timing to draw the counter early","Stay outside and win a low-output fight","Load up power shots to make them respect you"],correct:1,category:"strategy",explanation:"Feints draw the counter early. When they fire on a feint, the real opening appears."},{id:"q94",question:"What is 'layering' combinations?",options:["Repeating one combo until it breaks through","Mixing head and body shots within one combination","Stacking power shots back to back to back","Throwing in bunches behind a high guard"],correct:1,category:"strategy",explanation:"Head-body-head variations keep the opponent guessing where the next shot lands."},{id:"q95",question:"Why do some fighters intentionally lean on the ropes?",options:["Their legs are gone and they're surviving","Absorbing and deflecting while the opponent tires","Baiting the referee into a standing count","Resting the back leg between exchanges"],correct:1,category:"strategy",explanation:"When executed properly, using the ropes lets you absorb while the opponent punches themselves out."},{id:"q96",question:"What is 'active recovery' in boxing training?",options:["Full rest days with zero movement","Light movement between hard rounds to keep blood flowing","Stretching only after the session ends","Low-intensity sparring on scheduled rest days"],correct:1,category:"conditioning",explanation:"Active recovery flushes lactic acid and keeps muscles warm without adding fatigue."},{id:"q97",question:"Why do fighters train at altitude?",options:["Cooler air reduces overheating in camp","Thin air builds red blood cells for better endurance","The isolation sharpens mental focus","Lower oxygen forces longer, slower sessions"],correct:1,category:"conditioning",explanation:"More red blood cells = better oxygen delivery = deeper gas tank at sea level."},{id:"q98",question:"What role does core strength play in punching power?",options:["It absorbs body shots without damage","It bridges force from the legs into the upper body","It keeps the spine stable under pressure","It speeds up the rotation on hooks only"],correct:1,category:"conditioning",explanation:"A weak core leaks power. A strong core channels every bit of force through the punch."},{id:"q99",question:"Why is the liver shot considered one of the most devastating body punches?",options:["The liver ruptures easily and ends careers","A clean liver shot forces an involuntary shutdown","The pain lingers for several rounds after","It cannot be blocked by dropped elbows"],correct:1,category:"conditioning",explanation:"The liver shot triggers a vagal response. The body literally shuts down. No willpower overcomes it."},{id:"q100",question:"What is 'overtraining' and why is it dangerous for fighters?",options:["Training past recovery -- performance drops, injury and illness risk rise","Training twice every day through a full eight-week fight camp","Peaking too early in camp, weeks before the fight date arrives","Adding brand-new techniques in the final days before a bout"],correct:0,category:"conditioning",explanation:"Overtraining breaks the body down faster than it can recover. Peak performance requires smart rest."},{id:"q101",question:"You've hurt the opponent badly. What's the correct instruction?",options:["Load up on one big shot to finish it","Stay composed, pick clean shots, stay defensively sound","Swarm with everything and overwhelm them","Back off and let the referee take a look"],correct:1,category:"ring_iq",explanation:"More fights are saved by a wild finisher than lost. Hurt opponents are still dangerous -- pick shots, stay tight."},{id:"q102",question:"Mid-fight the opponent's mouth opens and their chest starts heaving. What's the read?",options:["They're baiting you into overcommitting","Their gas tank is going -- invest in the body","They're settling into a slower pace on purpose","They've been told to conserve for later rounds"],correct:1,category:"ring_iq",explanation:"Open mouth and heavy chest is the first honest sign of fatigue. Go downstairs and make it worse."},{id:"q103",question:"The opponent dips their rear shoulder every time before the right hand. What is that?",options:["A deliberate feint to draw your counter","A telegraph -- time it and beat them to it","Normal mechanics you can safely ignore","A sign they're loading up for the body"],correct:1,category:"ring_iq",explanation:"A tell is free information. Once you've seen it twice, you can leave before the punch arrives."},{id:"q104",question:"Your fighter is cut over the left eye in round three. What's the adjustment?",options:["Cover the cut and fight purely defensively","Circle away from their power hand, avoid head clashes, raise the pace","Trade heavily to end it before the doctor looks","Clinch constantly to keep the cut out of range"],correct:1,category:"ring_iq",explanation:"A cut puts you on a clock. Protect the side it's on, avoid the clash that opened it, and force the issue while you still can."},{id:"q105",question:"You're facing a fighter with a significantly longer reach. Where is the most dangerous place to stand?",options:["Just outside their lead hand's range","Mid range -- in their reach, short of yours","Directly inside on their chest","Along the ropes at any distance"],correct:1,category:"ring_iq",explanation:"That's no man's land: close enough to be hit, too far to hit back. Be all the way out or all the way in -- never in between."},{id:"q106",question:"The opponent ties you up every time you get inside. What's the counter?",options:["Ask the referee to warn them for holding","Work the instant you arrive, before the arms close","Stop coming inside and box at range","Push off hard and reset to the center"],correct:1,category:"ring_iq",explanation:"A holder buys time by smothering. Beat the clinch by punching on arrival instead of setting your feet first."},{id:"q107",question:"The opponent has stopped throwing their jab entirely. What does that usually mean?",options:["They've been told to protect a points lead","They're tired, or loading up for something big","They're switching to a body-first attack","They're conceding the round to rest"],correct:1,category:"ring_iq",explanation:"The jab is the first thing fatigue takes and the first thing a headhunter abandons. Either way, something changed -- adjust."},{id:"q108",question:"When is an opponent most vulnerable during an exchange?",options:["The instant they finish their combination","In the moment they first commit forward","While they're resetting their guard at range","Right as they plant to load a power shot"],correct:0,category:"ring_iq",explanation:"The end of a combination is where the guard is lowest and the feet are worst. Counter there."},{id:"q109",question:"A pressure fighter keeps coming forward leading with their head. Correct response?",options:["Meet them head-on and hold the center","Angle off, work the body on entry, avoid the clash","Lean back on the ropes and let them tire","Hold every time they get within range"],correct:1,category:"ring_iq",explanation:"Never trade real estate straight back against pressure. Turn them, hurt the body on the way in, and don't let the heads meet."},{id:"q110",question:"You're losing exchanges in the center of the ring. What should change first?",options:["The aggression -- throw more and harder","The angle and position, not the output","The target -- switch entirely to the body","The pace -- slow it down and reset"],correct:1,category:"ring_iq",explanation:"If you're losing the same exchange repeatedly, more of it loses faster. Change where you stand before you change how hard you throw."},{id:"q111",question:"What is a 'check hook'?",options:["A short hook thrown from inside the clinch","A hook thrown while pivoting away from a charging opponent","A hook that checks the opponent's lead hand down","A half-power hook used to measure distance"],correct:1,category:"offense",explanation:"You pivot off the line and let them run onto it. Famously how Mayweather dropped Hatton."},{id:"q112",question:"Why would a fighter double up the jab?",options:["The second lands as they react to the first","It scores twice as heavily with the judges","It builds the shoulder endurance for later","It keeps the rear hand fully loaded longer"],correct:0,category:"offense",explanation:"The first jab moves the guard or the head. The second arrives in the space that opens."},{id:"q113",question:"What is the overhand right designed to beat?",options:["A low guard held down at the waist","A high, tight guard or a shorter opponent's jab","An opponent circling toward your lead hand","A southpaw's straight left down the middle"],correct:1,category:"offense",explanation:"It loops over the top rather than through -- the answer to a guard you can't punch straight past."},{id:"q114",question:"How does a solar plexus shot differ from a liver shot?",options:["The solar plexus shot causes far more lasting damage","Solar plexus empties the lungs; the liver shuts the body down","They are effectively the same punch to different sides","The solar plexus shot is legal, the liver shot is not"],correct:1,category:"offense",explanation:"Solar plexus takes your wind. The liver takes your legs, your will, and your night."},{id:"q115",question:"What does 'fighting off the back foot' mean?",options:["Retreating without throwing anything back","Giving ground deliberately while countering as they follow","Standing flat-footed to absorb pressure","Keeping the weight loaded to sit on shots"],correct:1,category:"strategy",explanation:"Moving backward isn't running if punches come back. You're inviting them onto shots they can't see coming."},{id:"q116",question:"What is a 'rabbit punch'?",options:["A rapid flurry thrown with no real power","An illegal blow to the back of the head or neck","A short jab thrown while backing away","A punch landed after the bell has rung"],correct:1,category:"history",explanation:"Illegal everywhere. Shots to the back of the head risk catastrophic damage to the brain stem."},{id:"q117",question:"What's the difference between a split and a majority decision?",options:["Split is 2-1 for one fighter; majority is 2 for one with 1 draw","Split means the judges disagreed on the final round only","Majority requires all three judges to score it identically","Split decisions can be appealed; majority decisions cannot"],correct:0,category:"history",explanation:"Split: two judges one way, one the other. Majority: two judges one way, one scoring it even."},{id:"q118",question:"What is a 'technical decision'?",options:["A fight stopped by the referee for a lack of action","A fight stopped by accidental foul, scored to that point","A decision overturned by the commission afterward","A fight scored entirely on punch statistics"],correct:1,category:"history",explanation:"If an accidental foul ends it after the minimum rounds, the judges' cards to that moment decide the winner."},{id:"q119",question:"What is 'ring rust'?",options:["Lost conditioning from months out of the gym","Dulled timing and reflexes from a long layoff","Scar tissue that reopens easily around the eyes","Reluctance to engage after a knockout loss"],correct:1,category:"conditioning",explanation:"Fitness comes back in weeks. Timing is the last thing to return -- that's why comeback fights are chosen carefully."},{id:"q120",question:"What does the double-end bag develop that the heavy bag cannot?",options:["Raw punching power through a resisting target","Timing and accuracy against a moving target","Endurance across sustained long combinations","Wrist and forearm strength on impact"],correct:1,category:"conditioning",explanation:"The heavy bag never moves and never hits back. The double-end bag makes you time something that does both."},{id:"q121",question:"Where should your eyes be fixed on an opponent?",options:["On the gloves, to see punches start","On the chest, to see the whole body move","On the feet, to read the next step","On the eyes, to read their intention"],correct:1,category:"fundamentals",explanation:"Hands lie, eyes lie. The chest and shoulders move before every punch and can't fake it."},{id:"q122",question:"Why should you exhale sharply when you punch?",options:["It makes the punch land audibly harder","It braces the core and keeps you from holding your breath","It signals the referee that the shot was clean","It slows the heart rate between exchanges"],correct:1,category:"fundamentals",explanation:"The hiss tightens the core on impact and keeps oxygen moving. Holding your breath gasses you in a round."},{id:"q123",question:"What is a 'pivot' in boxing footwork?",options:["A hop that switches the lead foot","Rotating on the lead foot to change the angle","A backward shuffle to reset distance","Stepping across to cut the ring"],correct:1,category:"fundamentals",explanation:"Plant the lead foot, swing the rear foot around it. You're off the line and he's facing empty space."},{id:"q124",question:"Why should you never cross your feet while moving?",options:["It telegraphs which way you're going","It kills your balance and leaves you unable to punch","It puts your weight on the wrong foot for a jab","The referee will warn you for it"],correct:1,category:"fundamentals",explanation:"Crossed feet means no base. One shot while they're crossed and you're on the floor."},{id:"q125",question:"What is the difference between a slip and a duck?",options:["A slip goes to the side, a duck goes straight down","A slip is against jabs only, a duck is against hooks only","A slip uses the hands, a duck uses the legs","There is none; the terms are interchangeable"],correct:0,category:"defense",explanation:"Slip moves the head off the line of a straight punch. Duck drops under it -- and ducking into an uppercut is how people get slept."},{id:"q126",question:"What is a 'high guard' and what is its weakness?",options:["Both gloves at the temples; leaves the body open","Lead hand extended; leaves the chin open","Rear hand at the chin; leaves the lead side open","Elbows tucked low; leaves the head open"],correct:0,category:"defense",explanation:"The earmuffs stop everything upstairs and invite everything downstairs. Every guard buys one thing with another."},{id:"q127",question:"Why is blocking a punch worse than making it miss?",options:["Blocked punches still score for the opponent","A blocked punch still lands force on you and costs you position","Blocking is illegal in amateur boxing","A blocked punch always breaks the guard hand"],correct:1,category:"defense",explanation:"A block absorbs. A miss makes him pay for the swing. Blocks are the fallback when the read came too late."},{id:"q128",question:"What is 'cover-up' defense and when is it correct?",options:["Turtling behind both gloves when you're hurt and need to survive","Wrapping the opponent's arms to stop their punching","Covering distance quickly to smother the jab","Dropping the hands to invite a shot and counter"],correct:0,category:"defense",explanation:"Cover up buys seconds, not rounds. Use it to clear your head, then get out or get off."},{id:"q129",question:"Why is stepping straight back a bad defensive habit?",options:["It's considered running and costs you the round","The opponent follows on a straight line and you end up on the ropes","It uses more energy than stepping sideways","It exposes the back of the head to rabbit punches"],correct:1,category:"defense",explanation:"Straight back is the one direction that keeps you on his line. Angles get you off it."},{id:"q130",question:"Why should you jab to the body before hooking to the head?",options:["Body jabs score higher on the cards","The body jab pulls the guard down and opens the head","Referees favor fighters who vary targets","The body jab is the most powerful punch"],correct:1,category:"offense",explanation:"Go low, and the elbows drop to cover. Then the head is there for the taking."},{id:"q131",question:"What is a 'lead right hand' and why is it risky?",options:["A cross thrown without a jab first; it's slow to get there and easy to counter","A right hook thrown from the southpaw stance; it's illegal","A jab thrown with the rear hand; it's weak","A straight right off the ropes; it leaves you cornered"],correct:0,category:"offense",explanation:"The right has the longest road to travel. Thrown naked, they see it coming and you're off balance if it misses."},{id:"q132",question:"Why finish a combination with a hook rather than a straight punch?",options:["The hook scores more on the judges' cards","The hook turns you back square to the opponent so you're set to defend","The hook tires the opponent's arms faster","The hook is easier to land than a cross"],correct:1,category:"offense",explanation:"A straight leaves you extended and reaching. The hook brings the hips back around and puts you in stance."},{id:"q133",question:"What does 'punching in bunches' mean?",options:["Throwing wide looping shots in a flurry","Throwing combinations rather than single shots","Attacking the opponent's arms and gloves","Landing only when the opponent is tied up"],correct:1,category:"offense",explanation:"One punch can be slipped. Three in a row and the second or third finds something."},{id:"q134",question:"What is the 'jab to the chest' good for?",options:["Scoring points when the head is covered","Stopping a pressure fighter's forward momentum","Setting up the liver shot","Nothing; it's a wasted punch"],correct:1,category:"offense",explanation:"A stiff jab to the sternum stalls the walk-in. You don't need to hurt him, you need to stop his feet."},{id:"q135",question:"Why throw the uppercut right after a hook?",options:["The hook leaves the guard turned and the middle open","The uppercut is faster from that arm","Judges reward the hook-uppercut pairing","The hook lands more often than the uppercut"],correct:0,category:"offense",explanation:"A hook makes him brace sideways; the uppercut comes up the middle he just stopped protecting."},{id:"q136",question:"The opponent is a taller fighter who jabs and moves. Where do you want the fight?",options:["At the center of the ring at long range","Inside, chest to chest, where his reach means nothing","Along the ropes where you can't be circled","At mid-range where you can trade evenly"],correct:1,category:"strategy",explanation:"Reach only matters at range. Get inside and his jab is a push while your hooks have room."},{id:"q137",question:"You have the longer reach. What's the mistake to avoid?",options:["Throwing the jab too often","Letting him inside the jab where your length is a liability","Moving laterally instead of straight back","Throwing to the body at range"],correct:1,category:"strategy",explanation:"A long fighter who gets walked down has surrendered his one edge. Keep the fight at the end of the jab."},{id:"q138",question:"An opponent shows the same tell before every right hand. What's the smart play?",options:["Counter it every single time to punish him","Counter it when it matters, and don't show him you've seen it too early","Ignore it; tells are usually deliberate","Move to the ropes to draw it out"],correct:1,category:"strategy",explanation:"Show him you've read it and a good fighter changes it. Bank the read for when you need it."},{id:"q139",question:"The opponent has been walking you backward all round. What's the first adjustment?",options:["Plant your feet and trade to earn respect","Pivot off the line so he has to reset his feet","Clinch on every entry to smother him","Raise the guard and let him punch himself out"],correct:1,category:"strategy",explanation:"A pressure fighter lives on a straight line. One pivot and he's walking at nothing."},{id:"q140",question:"When the opponent starts fighting off the ropes, what's the trap?",options:["Rushing in and getting caught by shots you can't see coming","Losing the round on the cards for inactivity","Being warned by the referee for pushing","Letting him escape to center ring"],correct:0,category:"strategy",explanation:"The ropes are where counter-punchers live. Punch with him there, don't dive in."},{id:"q141",question:"Why should a fighter change rhythm mid-round?",options:["To rest the arms between combinations","So the opponent can't time the pattern","Because judges reward variety","To avoid being warned for stalling"],correct:1,category:"strategy",explanation:"Timing beats speed. If you're metronomic, a slower fighter will still find you."},{id:"q142",question:"The opponent's lead foot steps outside yours. What has he just won?",options:["Distance to land the jab","The angle for his rear hand while yours is covered","The referee's position for a break","Nothing; foot position is cosmetic"],correct:1,category:"ring_iq",explanation:"Outside foot means his power hand has a straight line and yours doesn't. Win the foot battle or eat the right."},{id:"q143",question:"An opponent feints and you flinch hard. What has he learned?",options:["That you are tired","How you react and how long it takes you to reset","That you can't see the jab","That your guard is too high"],correct:1,category:"ring_iq",explanation:"A feint is a question. Overreact and you've answered it: next time the real shot comes on your reset."},{id:"q144",question:"The opponent loads up to the head three times, then dips low. What's coming?",options:["A clinch","The body shot he's been setting up","A retreat to reset the range","A switch to southpaw"],correct:1,category:"ring_iq",explanation:"Head, head, head, body. He's raised your guard and now he's going under it."},{id:"q145",question:"The opponent takes a step back every time you jab. What's the read?",options:["He's hurt and hiding it","He's measuring your reach to counter over the jab","He wants to be on the ropes","He's tired and buying time"],correct:1,category:"ring_iq",explanation:"A fighter who leans back off the jab is timing it. The next one gets a right hand over the top."},{id:"q146",question:"You've slipped the same punch four times in a row. What should you expect next?",options:["The same punch, harder","A different punch aimed at where your head goes when you slip","The opponent to stop throwing","A clinch attempt"],correct:1,category:"ring_iq",explanation:"A smart opponent doesn't keep missing. He throws where you're going, not where you are."},{id:"q147",question:"Why do trainers work the heavy bag in three-minute rounds?",options:["Bags wear out faster with longer rounds","To condition the body to the exact work-rest rhythm of a fight","Because gyms rent time by the round","To limit wrist injuries from long sessions"],correct:1,category:"conditioning",explanation:"You fight three minutes on, one off. Train any other way and the body learns the wrong clock."},{id:"q148",question:"Why is neck strength important for a boxer?",options:["It adds power to the hook","It slows the head's snap on impact and reduces knockouts","It improves the reach of the jab","It's cosmetic; it doesn't affect performance"],correct:1,category:"conditioning",explanation:"A knockout is the brain moving in the skull. A strong neck is the last thing between the punch and the lights."},{id:"q149",question:"Your fighter comes back to the corner insisting he's winning, and he isn't. What do you say?",options:["Agree with him to keep his confidence up","Tell him the truth plainly and give him one thing to change","Say nothing and let the cutman work","Threaten to stop the fight to motivate him"],correct:1,category:"corner",explanation:"A corner that lies is useless. Give the score straight and give the fix in one sentence."},{id:"q150",question:"What is the cutman's first job when the fighter sits down?",options:["Ask the fighter how the cut feels","Apply pressure to the cut before anything else","Check with the referee about the cut","Clean the blood so the corner can see"],correct:1,category:"corner",explanation:"Pressure stops the bleed. Everything else happens after -- the adrenaline, the swab, the Vaseline."}],wg=o=>{const l=o.options.map((d,p)=>p);for(let d=l.length-1;d>0;d--){const p=Math.floor(Math.random()*(d+1));[l[d],l[p]]=[l[p],l[d]]}return{...o,options:l.map(d=>o.options[d]),correct:l.indexOf(o.correct)}},vg={legends:a.regal,modern:a.sharp,records:a.gold,nicknames:a.sand,culture:a.spring},Sg=[{id:"t01",question:"Who lit the Olympic cauldron at the 1996 Atlanta Games and called himself 'The Greatest'?",options:["Joe Frazier","Muhammad Ali","George Foreman","Sugar Ray Leonard"],correct:1,category:"legends",explanation:"Ali's trembling torch-lighting is one of the Olympics' iconic moments."},{id:"t02",question:"Which heavyweight champion retired with a perfect 49-0 record?",options:["Rocky Marciano","Larry Holmes","Joe Louis","Floyd Patterson"],correct:0,category:"records",explanation:"Marciano is the only heavyweight champ to retire undefeated."},{id:"t03",question:"Who retired 50-0 in 2017 after beating Conor McGregor?",options:["Andre Ward","Floyd Mayweather","Manny Pacquiao","Terence Crawford"],correct:1,category:"records",explanation:"Mayweather broke Marciano's 49-0 with his 50th win."},{id:"t04",question:"Buster Douglas shocked the world in 1990 by knocking out whom?",options:["Evander Holyfield","Lennox Lewis","Mike Tyson","Riddick Bowe"],correct:2,category:"legends",explanation:"A massive underdog, Douglas KO'd the undefeated Tyson in Tokyo."},{id:"t05",question:"The 1974 'Rumble in the Jungle' saw Ali defeat which champion?",options:["Joe Frazier","George Foreman","Ken Norton","Sonny Liston"],correct:1,category:"legends",explanation:"Ali's rope-a-dope dethroned Foreman in Zaire."},{id:"t06",question:"The 1975 'Thrilla in Manila' was Ali's third and final bout with whom?",options:["Joe Frazier","George Foreman","Ken Norton","Leon Spinks"],correct:0,category:"legends",explanation:"Ali edged Frazier in a brutal 14 rounds."},{id:"t07",question:"Who became the first undisputed heavyweight champion in 25 years, beating Tyson Fury in 2024?",options:["Anthony Joshua","Deontay Wilder","Oleksandr Usyk","Daniel Dubois"],correct:2,category:"modern",explanation:"Usyk unified all four major belts in May 2024."},{id:"t08",question:"Tyson Fury fights under which nickname?",options:["The Bronze Bomber","The Gypsy King","The Body Snatcher","The Real Deal"],correct:1,category:"nicknames",explanation:"Fury is 'The Gypsy King.'"},{id:"t09",question:"Deontay Wilder, feared for his right hand, is known as?",options:["The Bronze Bomber","The Gypsy King","The Real Deal","The Executioner"],correct:0,category:"nicknames",explanation:"Wilder's power earned him 'The Bronze Bomber.'"},{id:"t10",question:"Naoya Inoue, who unified at bantamweight and 122 lbs, is nicknamed?",options:["The Monster","The Machine","The Hawk","The Ghost"],correct:0,category:"modern",explanation:"Japan's Inoue is 'The Monster.'"},{id:"t11",question:"Manny Pacquiao holds the record for world titles in how many weight divisions?",options:["Five","Six","Seven","Eight"],correct:3,category:"records",explanation:"Pacquiao is the only eight-division world champion."},{id:"t12",question:"Mike Tyson became the youngest heavyweight champion in history in 1986 at what age?",options:["20","22","24","19"],correct:0,category:"records",explanation:"Tyson was 20 when he stopped Trevor Berbick."},{id:"t13",question:"The 'No Mas' fight (1980) ended when Roberto Duran quit against whom?",options:["Thomas Hearns","Marvin Hagler","Sugar Ray Leonard","Wilfred Benitez"],correct:2,category:"legends",explanation:"Duran turned from Leonard, reportedly saying 'no mas.'"},{id:"t14",question:"The 1980s 'Four Kings' were Leonard, Hagler, Hearns, and who?",options:["Roberto Duran","Julio Cesar Chavez","Alexis Arguello","Wilfred Benitez"],correct:0,category:"legends",explanation:"The four repeatedly fought each other in classics."},{id:"t15",question:"What does Canelo Alvarez's nickname 'Canelo' mean, a nod to his red hair?",options:["Lion","Cinnamon","Hammer","Fire"],correct:1,category:"culture",explanation:"'Canelo' is Spanish for cinnamon."},{id:"t16",question:"Terence Crawford became undisputed welterweight champion in 2023 by stopping whom?",options:["Errol Spence Jr.","Shawn Porter","Kell Brook","Jeff Horn"],correct:0,category:"modern",explanation:"Crawford dominated Spence to unify at 147."},{id:"t17",question:"Which Irish star became undisputed lightweight champion and headlined Madison Square Garden?",options:["Savannah Marshall","Katie Taylor","Claressa Shields","Amanda Serrano"],correct:1,category:"modern",explanation:"Taylor is an Olympic gold medalist and undisputed champ."},{id:"t18",question:"Two-time Olympic gold medalist Claressa Shields hails from which US city?",options:["Detroit","Cleveland","Flint","Toledo"],correct:2,category:"modern",explanation:"Shields is from Flint, Michigan."},{id:"t19",question:"George Foreman regained the heavyweight title in 1994 at age 45 by knocking out whom?",options:["Evander Holyfield","Michael Moorer","Tommy Morrison","Axel Schulz"],correct:1,category:"legends",explanation:"Foreman became the oldest heavyweight champ ever."},{id:"t20",question:"Gennadiy Golovkin, longtime middleweight champ and Canelo rival, is nicknamed?",options:["TBE","GGG","El Terrible","Kid Dynamite"],correct:1,category:"nicknames",explanation:"'GGG' / 'Triple G' was a knockout machine at 160."},{id:"t21",question:"Sugar Ray Robinson, often called the greatest pound-for-pound ever, fought mainly in which decades?",options:["1920s-30s","1940s-50s","1960s-70s","1980s-90s"],correct:1,category:"legends",explanation:"Robinson's prime spanned the 1940s and 50s."},{id:"t22",question:"The lightest professional weight class, with a 105 lb limit, is called?",options:["Flyweight","Bantamweight","Minimumweight","Featherweight"],correct:2,category:"records",explanation:"Minimumweight (strawweight) caps at 105 lbs."},{id:"t23",question:"Mayweather vs. Pacquiao (2015) was promoted as the?",options:["Thrilla in Manila","Fight of the Century","Rumble in the Jungle","The Showdown"],correct:1,category:"culture",explanation:"The long-awaited bout shattered pay-per-view records."},{id:"t24",question:"Vasiliy Lomachenko, a footwork master and two-time Olympic champ, boxes for which country?",options:["Russia","Ukraine","Kazakhstan","Romania"],correct:1,category:"modern",explanation:"Lomachenko is Ukrainian."},{id:"t25",question:"Which Briton was the last undisputed heavyweight champion before Usyk?",options:["Lennox Lewis","Frank Bruno","Anthony Joshua","David Haye"],correct:0,category:"legends",explanation:"Lewis was undisputed in 1999-2000."},{id:"t26",question:"Joe Frazier, Ali's great rival, was nicknamed?",options:["Smokin' Joe","Iron Joe","Big Joe","Sugar Joe"],correct:0,category:"nicknames",explanation:"Frazier's relentless pressure made him 'Smokin' Joe.'"},{id:"t27",question:"Roberto Duran, the Panamanian legend, was known as?",options:["Hands of Stone","Iron Fist","The Hammer","Stone Cold"],correct:0,category:"nicknames",explanation:"'Manos de Piedra' -- Hands of Stone."},{id:"t28",question:"Amanda Serrano, a multi-division champion and Katie Taylor rival, represents which country?",options:["Mexico","Puerto Rico","Dominican Republic","Cuba"],correct:1,category:"modern",explanation:"Serrano is Puerto Rican."},{id:"t29",question:"Dominant 1980s middleweight champ Marvin Hagler legally changed his first name to what?",options:["Marvelous","Magic","Money","Iron"],correct:0,category:"nicknames",explanation:"He became 'Marvelous Marvin Hagler' on paper."},{id:"t30",question:"Which heavyweight, 'The Real Deal,' beat Mike Tyson twice in the 1990s?",options:["Riddick Bowe","Evander Holyfield","Lennox Lewis","Larry Holmes"],correct:1,category:"legends",explanation:"Holyfield won in 1996 and the 1997 'bite fight.'"},{id:"t31",question:"Which heavyweight was nicknamed 'The Brown Bomber' and reigned for nearly 12 years?",options:["Joe Louis","Jack Johnson","Sonny Liston","Floyd Patterson"],correct:0,category:"legends",explanation:"Joe Louis held the title from 1937 to 1949."},{id:"t32",question:"How did Terence Crawford beat Errol Spence Jr. in their 2023 undisputed welterweight bout?",options:["Ninth-round TKO","Split decision","A draw","First-round KO"],correct:0,category:"modern",explanation:"Crawford dropped Spence repeatedly and stopped him in the 9th."},{id:"t33",question:"Muhammad Ali was the first man to win the lineal heavyweight title how many times?",options:["Twice","Three times","Four times","Once"],correct:1,category:"records",explanation:"Ali won it in 1964, 1974, and 1978."},{id:"t34",question:"Oscar De La Hoya, the 1992 Olympic champion turned promoter, was nicknamed?",options:["The Golden Boy","Sugar","The Hitman","Pretty Boy"],correct:0,category:"nicknames",explanation:"He won gold in Barcelona and became 'The Golden Boy.'"},{id:"t35",question:"Thomas 'Hitman' Hearns rose out of the famed Kronk Gym in which city?",options:["Detroit","Philadelphia","Brooklyn","Chicago"],correct:0,category:"legends",explanation:"Emanuel Steward's Kronk Gym in Detroit produced Hearns."},{id:"t36",question:"Which corner is traditionally assigned to the champion or favored fighter?",options:["Red corner","Blue corner","Neutral corner","Gold corner"],correct:0,category:"culture",explanation:"The champion typically occupies the red corner."},{id:"t37",question:"How many rounds is a modern world championship fight scheduled for?",options:["Ten","Twelve","Fifteen","Eight"],correct:1,category:"records",explanation:"Title fights have been 12 rounds since the late 1980s."},{id:"t38",question:"Until the late 1980s, how many rounds were world title fights scheduled for?",options:["Twelve","Fifteen","Twenty","Ten"],correct:1,category:"history",explanation:"The classic distance was 15 rounds before the move to 12."},{id:"t39",question:"Hard-hitting modern champion Gervonta Davis is nicknamed?",options:["Tank","Bud","Boots","King Ry"],correct:0,category:"modern",explanation:"Baltimore's Gervonta Davis goes by 'Tank.'"},{id:"t40",question:"Which heavyweight champion was stripped of his title in 1967 for refusing the military draft?",options:["Muhammad Ali","Joe Frazier","Sonny Liston","Floyd Patterson"],correct:0,category:"legends",explanation:"Ali was stripped during his prime over his draft refusal."},{id:"t41",question:"Floyd Mayweather won world titles in how many weight divisions?",options:["Four","Five","Six","Eight"],correct:1,category:"records",explanation:"Mayweather won belts from 130 up to 154 -- five divisions."},{id:"t42",question:"Long-reigning middleweight champion Bernard Hopkins first went by which nickname?",options:["The Executioner","The Hitman","The Truth","The Professor"],correct:0,category:"nicknames",explanation:"Hopkins was 'The Executioner' before later calling himself 'The Alien.'"},{id:"t43",question:"The Marquess of Queensberry Rules, which standardized gloved boxing, date from which century?",options:["18th","19th","17th","20th"],correct:1,category:"history",explanation:"The rules were published in 1867."},{id:"t44",question:"Canelo Alvarez became undisputed champion in 2021 in which division?",options:["Super middleweight","Middleweight","Light heavyweight","Welterweight"],correct:0,category:"modern",explanation:"Canelo unified all four 168 lb be  off you, BODY spends his legs. His guard tells you where to dig: hands high means go downstairs."},{title:"FEET & DEFENSE",text:"STEP IN / STEP OUT walk to the range your punch wants — and the fight drifts on its own, so distance is a job, not a setting. HIGH GUARD resets a tight guard (halves what he lands). The CHECK HOOK pays most against a man who just stepped in. FEINT makes him show you an opening."},{title:"THE CARDS",text:"Rounds score on the real four: clean punching, effective aggression, ring generalship, defense. A busy jab wins rounds a lazy bomb doesn't, and after the bell the corner names which one carried it. Every bell resets you both to long range, center ring. A knockout ends the argument early."},{title:"TWO ENGINES",text:"Every exchange runs three phases whether you think about them or not: it BEGINS, offense and defense COLLIDE, and it ENDS. You can disguise a phase — a feint begins danger without throwing, a clinch ends it by taking the room away — but you cannot skip one. The third is the one most players never spend a turn on. If neither man ends an exchange, it stays open, and the man who didn't start it is left standing in front of a loaded hand: he gets hit more easily on the next one. STEP OUT, PIVOT and CLINCH are how you end it — but ending it means he can no longer answer you cleanly, not just that you moved. PIVOT and CLINCH always work. STEP OUT only works if his arms don't still reach the range you land at: give ground to a longer man and he comes with you, and the exchange is still live. Against reach, take the angle."},{title:"WHAT HE RUNS",text:"Your fighter isn't a stat line — he's four layers. HARDWARE is what he was born with: reach, power, his engine. It sets limits and no drill changes it. SOFTWARE is what the gym taught him: the jab, the feet, the defence. PROGRAMS is his style — the exchanges he's built around and the ones he's built to avoid. PROCESSES is his ring IQ: how fast he reads you and adapts. Two fighters can see the exact same thing and do different things with it, and that's why. On the action list, HIS GAME means this is work your man was built for and it costs him a point less; NOT HIS GAME means it costs a point more. Nothing is off the menu — a counterpuncher can stand and trade if he has to. It just isn't free."},{title:"YOUR LOOP",text:"When the fight ends you get four marks, and they are not about boxing — they are about thinking. READ: when he showed you something, did you answer what he was actually doing? (Covering a punch counts; punishing a pause counts; trading with him doesn't — it's often right, it just isn't a read.) PROCESS: what the work cost you, in damage landed per point of stamina spent. WIN: how many exchanges you ended cleanly in your favour. ADAPT: how much of the night he spent NOT having you solved. You can't max all four — covering up every exchange scores perfectly on READ and nothing on the other three. That's deliberate. The four together are the picture; any one of them alone is a bad habit."},{title:"STACKED",text:"The same three phases run at the size of a whole ROUND, and the header names which one you're in. ENGAGE is the opening — you both walk out at long range and nobody can be caught out for not ending an exchange that just started. WORK is the body of it. CLOSING is the last of it. The bell is the round's own ending: it resets where you're standing, who's under pressure and the referee's patience — but never what he has learned about you, because a read is supposed to survive the round it was built in. And there is a third man in there. Tie him up twice in a row and the referee breaks it, puts you both back at mid-range in the centre, and won't let you clinch again on the next exchange. That is what stops the clinch being a free reset."},{title:"HE READS YOU BACK",text:"The loop runs both ways. He watches three things across your last eight exchanges — which hand you throw, the range you keep choosing, and the guard you keep showing — and once one of them turns into a habit he starts expecting it. A HIS READ strip appears and that habit stops working. He doesn't hit harder; he stops being surprised. So varying your punches isn't enough on its own: a man who mixes his hands but never moves his feet is still being read. Change the thing he named and the read decays in a few exchanges. Smart fighters read faster off fewer punches; a green one never reads you at all."}],B0=({onClose:o,cards:l=pf})=>i.jsxs("div",{onClick:o,style:{position:"absolute",inset:0,zIndex:40,background:"rgba(0,0,0,0.88)",padding:"24px 16px",overflowY:"auto",cursor:"pointer"},children:[i.jsx("div",{style:{...h.heading,fontSize:16,color:a.gold,letterSpacing:3,textAlign:"center",marginBottom:12},children:"CORNER TALK"}),l.map(d=>i.jsxs("div",{style:{...h.card,marginBottom:8,padding:"10px 12px"},children:[i.jsx("div",{style:{...h.mono,fontSize:9,color:a.sharp,letterSpacing:2,marginBottom:4},children:d.title}),i.jsx("div",{style:{...h.mono,fontSize:11,color:a.narration,lineHeight:1.6},children:d.text})]},d.title)),i.jsx("div",{style:{...h.mono,fontSize:9,color:a.narrationDim,textAlign:"center",marginTop:10},children:"tap anywhere to get back in there"})]}),z0=({loop:o})=>{const l=Bw(o),d=zw(l);return o!=null&&o.exchanges?i.jsxs("div",{style:{...h.card,marginBottom:8,padding:"10px 12px"},children:[i.jsx("div",{style:{...h.mono,fontSize:8,color:a.sharp,letterSpacing:2,marginBottom:6},children:"YOUR LOOP"}),nf.map(p=>{const f=l[p],y=typeof f=="number",w=y?f>=65?a.spring:f>=45?a.gold:a.blood:a.narrationDim;return i.jsxs("div",{style:{display:"flex",alignItems:"center",gap:6,marginBottom:3},children:[i.jsx("span",{style:{...h.mono,fontSize:8,color:a.narrationDim,letterSpacing:1,width:52,flexShrink:0},children:p.toUpperCase()}),i.jsx("div",{style:{flex:1,height:4,background:"#151515",borderRadius:2,overflow:"hidden"},children:i.jsx("div",{style:{width:`${y?f:0}%`,height:"100%",background:w}})}),i.jsx("span",{style:{...h.mono,fontS
